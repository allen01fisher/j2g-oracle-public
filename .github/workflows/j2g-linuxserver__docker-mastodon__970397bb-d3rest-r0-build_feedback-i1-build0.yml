name: Jenkins Migration
permissions:
  contents: write
  packages: write
jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      BUILDS_DISCORD: ${{ secrets.BUILDS_DISCORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_NAMESPACE: ${{ secrets.GITLAB_NAMESPACE }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAYIO_API_TOKEN: ${{ secrets.QUAYIO_API_TOKEN }}
      GIT_SIGNING_KEY: ${{ secrets.GIT_SIGNING_KEY }}
      EXT_GIT_BRANCH: j2g-redacted
      EXT_USER: j2g-redacted
      EXT_REPO: j2g-redacted
      CONTAINER_NAME: j2g-redacted
      BUILD_VERSION_ARG: j2g-redacted
      LS_USER: j2g-redacted
      LS_REPO: j2g-redacted
      DOCKERHUB_IMAGE: j2g-redacted
      DEV_DOCKERHUB_IMAGE: j2g-redacted
      PR_DOCKERHUB_IMAGE: j2g-redacted
      DIST_IMAGE: j2g-redacted
      MULTIARCH: j2g-redacted
      CI: j2g-redacted
      CI_WEB: j2g-redacted
      CI_PORT: j2g-redacted
      CI_SSL: j2g-redacted
      CI_DELAY: j2g-redacted
      CI_DOCKERENV: j2g-redacted
      CI_AUTH: j2g-redacted
      CI_WEBPATH: j2g-redacted
      PACKAGE_CHECK: ${{ inputs.PACKAGE_CHECK || 'false' }}
      CHANGE_ID: ${{ github.event.pull_request.number }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      GIT_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      NODE_NAME: ${{ runner.name }}
      WORKSPACE: ${{ github.workspace }}
      SYFT_IMAGE_TAG: latest
      GITLAB_TIMEOUT: '600'
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set git config
      run: j2g_op set_git_config
    - name: Create Bash Function
      run: "#! /bin/bash\nretry_ghcr() {\n  local max_attempts=7\n  local base_delay=10\n\
        \  local max_delay=90\n  local attempt=1\n  local errfile exit_code delay\
        \ pause\n  errfile=$(mktemp)\n  while true; do\n    # run inside an if so\
        \ a caller's set -e cannot abort before we get to retry\n    if \"$@\" 2>\
        \ >(tee \"${errfile}\" >&2); then\n      exit_code=0\n    else\n      exit_code=$?\n\
        \    fi\n    # make sure tee has finished writing before we read the file\n\
        \    wait $! 2>/dev/null || true\n    if [[ \"${exit_code}\" == \"0\" ]];\
        \ then\n      rm -f \"${errfile}\"\n      return 0\n    elif ! grep -q -i\
        \ -E \"retry-after:|toomanyrequests|too many requests\" \"${errfile}\"; then\n\
        \      rm -f \"${errfile}\"\n      return \"${exit_code}\"\n    elif (( attempt\
        \ >= max_attempts )); then\n      rm -f \"${errfile}\"\n      echo \"retry:\
        \ $* failed after ${attempt} attempts (exit ${exit_code})\" >&2\n      return\
        \ \"${exit_code}\"\n    else\n      # exponential delay: base * 2^(attempt-1),\
        \ capped at max_delay\n      delay=$(( base_delay * 2 ** (attempt - 1) ))\n\
        \      (( delay > max_delay )) && delay=\"${max_delay}\"\n      # jitter between\
        \ half and full delay so parallel builds spread out\n      pause=$(( delay\
        \ / 2 + RANDOM % (delay / 2 + 1) ))\n      echo \"retry: attempt ${attempt}/${max_attempts}\
        \ failed (exit ${exit_code}); waiting ${pause}s...\" >&2\n      sleep \"${pause}\"\
        \n      ((attempt++))\n    fi\n  done\n}\n\ndeclare -f retry_ghcr > \"${WORKSPACE}/retry_ghcr.sh\"\
        \n"
    - name: Set ENV Variables base
      run: "#! /bin/bash\nset -e\necho \"Running on node: ${NODE_NAME}\"\necho \"\
        Pruning builder\"\ndocker builder prune -f --builder container || :\ncontainers=$(docker\
        \ ps -q)\nif [[ -n \"${containers}\" ]]; then\n  BUILDX_CONTAINER_ID=$(docker\
        \ ps -qf 'name=buildx_buildkit')\n  for container in ${containers}; do\n \
        \   if [[ \"${container}\" == \"${BUILDX_CONTAINER_ID}\" ]]; then\n      echo\
        \ \"skipping buildx container in docker stop\"\n    else\n      echo \"Stopping\
        \ container ${container}\"\n      docker stop ${container}\n    fi\n  done\n\
        fi\ndocker system prune -f --volumes || :\ndocker image prune -af || :\n\n\
        echo \"EXIT_STATUS=\" >> \"$GITHUB_ENV\"\necho \"CI_TEST_ATTEMPTED=\" >> \"\
        $GITHUB_ENV\"\necho \"PUSH_ATTEMPTED=\" >> \"$GITHUB_ENV\"\n\nsource \"${WORKSPACE}/retry_ghcr.sh\"\
        \nLS_RELEASE=\"$(retry_ghcr docker run --rm quay.io/skopeo/stable:v1 inspect\
        \ docker://ghcr.io/${LS_USER}/${CONTAINER_NAME}:latest | jq -r '.Labels.build_version'\
        \ | awk '{print $3}' | grep '\\-ls' || : )\"\nLS_RELEASE=\"$(printf '%s' \"\
        $LS_RELEASE\" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')\"\necho\
        \ \"LS_RELEASE=${LS_RELEASE}\" >> \"$GITHUB_ENV\"\n\nLS_RELEASE_NOTES=\"$(cat\
        \ readme-vars.yml | awk -F '\"' '/date: \"[0-9][0-9].[0-9][0-9].[0-9][0-9]:/\
        \ {print $4;exit;}' | sed -E ':a;N;$!ba;s/\\r{0,1}\\n/\\\\n/g')\"\nLS_RELEASE_NOTES=\"\
        $(printf '%s' \"$LS_RELEASE_NOTES\" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')\"\
        \necho \"LS_RELEASE_NOTES=${LS_RELEASE_NOTES}\" >> \"$GITHUB_ENV\"\n\nGITHUB_DATE=\"\
        $(date '+%Y-%m-%dT%H:%M:%S%:z')\"\necho \"GITHUB_DATE=${GITHUB_DATE}\" >>\
        \ \"$GITHUB_ENV\"\n\nCOMMIT_SHA=\"$(git rev-parse HEAD)\"\necho \"COMMIT_SHA=${COMMIT_SHA}\"\
        \ >> \"$GITHUB_ENV\"\n\nGH_DEFAULT_BRANCH=\"$(git remote show origin | grep\
        \ \"HEAD branch:\" | sed 's|.*HEAD branch: ||')\"\nGH_DEFAULT_BRANCH=\"$(printf\
        \ '%s' \"$GH_DEFAULT_BRANCH\" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')\"\
        \necho \"GH_DEFAULT_BRANCH=${GH_DEFAULT_BRANCH}\" >> \"$GITHUB_ENV\"\n\nCODE_URL=\"\
        https://github.com/${LS_USER}/${LS_REPO}/commit/${GIT_COMMIT}\"\necho \"CODE_URL=${CODE_URL}\"\
        \ >> \"$GITHUB_ENV\"\n\nDOCKERHUB_LINK=\"https://hub.docker.com/r/${DOCKERHUB_IMAGE}/tags/\"\
        \necho \"DOCKERHUB_LINK=${DOCKERHUB_LINK}\" >> \"$GITHUB_ENV\"\n\necho \"\
        PULL_REQUEST=${CHANGE_ID}\" >> \"$GITHUB_ENV\"\n\nTEMPLATED_FILES='Jenkinsfile\
        \ README.md LICENSE .editorconfig AGENTS.md ./.github/CONTRIBUTING.md ./.github/FUNDING.yml\
        \ ./.github/ISSUE_TEMPLATE/config.yml ./.github/ISSUE_TEMPLATE/issue.bug.yml\
        \ ./.github/ISSUE_TEMPLATE/issue.feature.yml ./.github/PULL_REQUEST_TEMPLATE.md\
        \ ./.github/workflows/external_trigger_scheduler.yml ./.github/workflows/greetings.yml\
        \ ./.github/workflows/package_trigger_scheduler.yml ./.github/workflows/call_issue_pr_tracker.yml\
        \ ./.github/workflows/call_issues_cron.yml ./.github/workflows/permissions.yml\
        \ ./.github/workflows/external_trigger.yml'\necho \"TEMPLATED_FILES=${TEMPLATED_FILES}\"\
        \ >> \"$GITHUB_ENV\"\n\nif [ -z \"${SYFT_IMAGE_TAG:-}\" ]; then\n  echo \"\
        SYFT_IMAGE_TAG=latest\" >> \"$GITHUB_ENV\"\nfi\nif [ -z \"${GITLAB_TIMEOUT:-}\"\
        \ ]; then\n  echo \"GITLAB_TIMEOUT=600\" >> \"$GITHUB_ENV\"\nfi\n\necho \"\
        Using syft image tag ${SYFT_IMAGE_TAG:-latest}\"\necho \"Using gitlab registry\
        \ timeout ${GITLAB_TIMEOUT:-600}\"\necho \"The default github branch detected\
        \ as ${GH_DEFAULT_BRANCH}\"\n\nLS_RELEASE_NUMBER=\"$(echo ${LS_RELEASE} |\
        \ sed 's/^.*-ls//g')\"\nLS_RELEASE_NUMBER=\"$(printf '%s' \"$LS_RELEASE_NUMBER\"\
        \ | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')\"\necho \"LS_RELEASE_NUMBER=${LS_RELEASE_NUMBER}\"\
        \ >> \"$GITHUB_ENV\"\n\nLS_TAG_NUMBER=\"$(tagsha=$(git rev-list -n 1 ${LS_RELEASE}\
        \ 2>/dev/null)\nif [ \"${tagsha}\" == \"${COMMIT_SHA}\" ]; then\n  echo ${LS_RELEASE_NUMBER}\n\
        elif [ -z \"${GIT_COMMIT}\" ]; then\n  echo ${LS_RELEASE_NUMBER}\nelse\n \
        \ echo $((${LS_RELEASE_NUMBER} + 1))\nfi)\"\nLS_TAG_NUMBER=\"$(printf '%s'\
        \ \"$LS_TAG_NUMBER\" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')\"\
        \necho \"LS_TAG_NUMBER=${LS_TAG_NUMBER}\" >> \"$GITHUB_ENV\"\n"
    - name: Set Package tag
      run: "#! /bin/bash\nif [ -e package_versions.txt ] ; then\n  PACKAGE_TAG=\"\
        $(cat package_versions.txt | md5sum | cut -c1-8)\"\nelse\n  PACKAGE_TAG=\"\
        none\"\nfi\necho \"PACKAGE_TAG=${PACKAGE_TAG}\" >> \"$GITHUB_ENV\"\n"
    - name: Set ENV github_stable
      run: '#! /bin/bash

        EXT_RELEASE="$(curl -H "Authorization: token ${GITHUB_TOKEN}" -s https://api.github.com/repos/${EXT_USER}/${EXT_REPO}/releases/latest
        | jq -r ''. | .tag_name'')"

        EXT_RELEASE="$(printf ''%s'' "$EXT_RELEASE" | sed -e ''s/^[[:space:]]*//''
        -e ''s/[[:space:]]*$//'')"

        echo "EXT_RELEASE=${EXT_RELEASE}" >> "$GITHUB_ENV"

        '
    - name: Set ENV github_link
      run: '#! /bin/bash

        RELEASE_LINK="https://github.com/${EXT_USER}/${EXT_REPO}/releases/tag/${EXT_RELEASE}"

        echo "RELEASE_LINK=${RELEASE_LINK}" >> "$GITHUB_ENV"

        '
    - name: Sanitize tag
      run: "#! /bin/bash\nEXT_RELEASE_CLEAN=\"$(echo ${EXT_RELEASE} | sed 's/[~,%@+;:/\
        \ ]//g')\"\nEXT_RELEASE_CLEAN=\"$(printf '%s' \"$EXT_RELEASE_CLEAN\" | sed\
        \ -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')\"\nSEMVER=\"\"\nif [[ \"\
        $EXT_RELEASE_CLEAN\" =~ ([0-9]+)\\.([0-9]+)\\.([0-9]+) ]]; then\n  SEMVER=\"\
        ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}\"\nelse\n  if [[\
        \ \"$EXT_RELEASE_CLEAN\" =~ ([0-9]+)\\.([0-9]+)(\\.([0-9]+))?(.*) ]]; then\n\
        \    if [ -n \"${BASH_REMATCH[4]}\" ]; then\n      SEMVER=\"${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[4]}\"\
        \n    elif [ -z \"${BASH_REMATCH[4]}\" ] && [ -z \"${BASH_REMATCH[5]}\" ];\
        \ then\n      SEMVER=\"${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(date +%Y%m%d)\"\
        \n    fi\n  fi\nfi\nif [ -n \"${SEMVER}\" ]; then\n  if [ \"${BRANCH_NAME}\"\
        \ != \"${GH_DEFAULT_BRANCH}\" ]; then\n    SEMVER=\"${SEMVER}-${BRANCH_NAME}\"\
        \n  fi\n  echo \"SEMVER: ${SEMVER}\"\nelse\n  echo \"No SEMVER detected\"\n\
        fi\necho \"EXT_RELEASE_CLEAN=${EXT_RELEASE_CLEAN}\" >> \"$GITHUB_ENV\"\necho\
        \ \"SEMVER=${SEMVER}\" >> \"$GITHUB_ENV\"\n"
    - name: Set ENV live build
      if: github.ref_name == 'main' && github.event_name != 'pull_request'
      run: "#! /bin/bash\necho \"IMAGE=${DOCKERHUB_IMAGE}\" >> \"$GITHUB_ENV\"\necho\
        \ \"GITHUBIMAGE=ghcr.io/${LS_USER}/${CONTAINER_NAME}\" >> \"$GITHUB_ENV\"\n\
        echo \"GITLABIMAGE=registry.gitlab.com/linuxserver.io/${LS_REPO}/${CONTAINER_NAME}\"\
        \ >> \"$GITHUB_ENV\"\necho \"QUAYIMAGE=quay.io/linuxserver.io/${CONTAINER_NAME}\"\
        \ >> \"$GITHUB_ENV\"\nif [ \"${MULTIARCH}\" == \"true\" ]; then\n  CI_TAGS=\"\
        amd64-${EXT_RELEASE_CLEAN}-ls${LS_TAG_NUMBER}|arm64v8-${EXT_RELEASE_CLEAN}-ls${LS_TAG_NUMBER}\"\
        \nelse\n  CI_TAGS=\"${EXT_RELEASE_CLEAN}-ls${LS_TAG_NUMBER}\"\nfi\necho \"\
        CI_TAGS=${CI_TAGS}\" >> \"$GITHUB_ENV\"\necho \"VERSION_TAG=${EXT_RELEASE_CLEAN}-ls${LS_TAG_NUMBER}\"\
        \ >> \"$GITHUB_ENV\"\necho \"META_TAG=${EXT_RELEASE_CLEAN}-ls${LS_TAG_NUMBER}\"\
        \ >> \"$GITHUB_ENV\"\necho \"EXT_RELEASE_TAG=version-${EXT_RELEASE_CLEAN}\"\
        \ >> \"$GITHUB_ENV\"\necho \"BUILDCACHE=docker.io/lsiodev/buildcache,registry.gitlab.com/linuxserver.io/docker-jenkins-builder/lsiodev-buildcache,ghcr.io/linuxserver/lsiodev-buildcache,quay.io/linuxserver.io/lsiodev-buildcache\"\
        \ >> \"$GITHUB_ENV\"\necho \"CITEST_IMAGETAG=latest\" >> \"$GITHUB_ENV\"\n"
    - name: Set ENV dev build
      if: github.ref_name != 'main' && github.event_name != 'pull_request'
      run: "#! /bin/bash\necho \"IMAGE=${DEV_DOCKERHUB_IMAGE}\" >> \"$GITHUB_ENV\"\
        \necho \"GITHUBIMAGE=ghcr.io/${LS_USER}/lsiodev-${CONTAINER_NAME}\" >> \"\
        $GITHUB_ENV\"\necho \"GITLABIMAGE=registry.gitlab.com/linuxserver.io/${LS_REPO}/lsiodev-${CONTAINER_NAME}\"\
        \ >> \"$GITHUB_ENV\"\necho \"QUAYIMAGE=quay.io/linuxserver.io/lsiodev-${CONTAINER_NAME}\"\
        \ >> \"$GITHUB_ENV\"\nif [ \"${MULTIARCH}\" == \"true\" ]; then\n  CI_TAGS=\"\
        amd64-${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}|arm64v8-${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}\"\
        \nelse\n  CI_TAGS=\"${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}\"\
        \nfi\necho \"CI_TAGS=${CI_TAGS}\" >> \"$GITHUB_ENV\"\necho \"VERSION_TAG=${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}\"\
        \ >> \"$GITHUB_ENV\"\necho \"META_TAG=${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}\"\
        \ >> \"$GITHUB_ENV\"\necho \"EXT_RELEASE_TAG=version-${EXT_RELEASE_CLEAN}\"\
        \ >> \"$GITHUB_ENV\"\necho \"DOCKERHUB_LINK=https://hub.docker.com/r/${DEV_DOCKERHUB_IMAGE}/tags/\"\
        \ >> \"$GITHUB_ENV\"\necho \"BUILDCACHE=docker.io/lsiodev/buildcache,registry.gitlab.com/linuxserver.io/docker-jenkins-builder/lsiodev-buildcache,ghcr.io/linuxserver/lsiodev-buildcache,quay.io/linuxserver.io/lsiodev-buildcache\"\
        \ >> \"$GITHUB_ENV\"\necho \"CITEST_IMAGETAG=develop\" >> \"$GITHUB_ENV\"\n"
    - name: Set ENV PR build
      if: github.event_name == 'pull_request'
      run: "#! /bin/bash\necho \"IMAGE=${PR_DOCKERHUB_IMAGE}\" >> \"$GITHUB_ENV\"\n\
        echo \"GITHUBIMAGE=ghcr.io/${LS_USER}/lspipepr-${CONTAINER_NAME}\" >> \"$GITHUB_ENV\"\
        \necho \"GITLABIMAGE=registry.gitlab.com/linuxserver.io/${LS_REPO}/lspipepr-${CONTAINER_NAME}\"\
        \ >> \"$GITHUB_ENV\"\necho \"QUAYIMAGE=quay.io/linuxserver.io/lspipepr-${CONTAINER_NAME}\"\
        \ >> \"$GITHUB_ENV\"\nif [ \"${MULTIARCH}\" == \"true\" ]; then\n  CI_TAGS=\"\
        amd64-${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}-pr-${PULL_REQUEST}|arm64v8-${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}-pr-${PULL_REQUEST}\"\
        \nelse\n  CI_TAGS=\"${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}-pr-${PULL_REQUEST}\"\
        \nfi\necho \"CI_TAGS=${CI_TAGS}\" >> \"$GITHUB_ENV\"\necho \"VERSION_TAG=${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}-pr-${PULL_REQUEST}\"\
        \ >> \"$GITHUB_ENV\"\necho \"META_TAG=${EXT_RELEASE_CLEAN}-pkg-${PACKAGE_TAG}-dev-${COMMIT_SHA}-pr-${PULL_REQUEST}\"\
        \ >> \"$GITHUB_ENV\"\necho \"EXT_RELEASE_TAG=version-${EXT_RELEASE_CLEAN}\"\
        \ >> \"$GITHUB_ENV\"\necho \"CODE_URL=https://github.com/${LS_USER}/${LS_REPO}/pull/${PULL_REQUEST}\"\
        \ >> \"$GITHUB_ENV\"\necho \"DOCKERHUB_LINK=https://hub.docker.com/r/${PR_DOCKERHUB_IMAGE}/tags/\"\
        \ >> \"$GITHUB_ENV\"\necho \"BUILDCACHE=docker.io/lsiodev/buildcache,registry.gitlab.com/linuxserver.io/docker-jenkins-builder/lsiodev-buildcache,ghcr.io/linuxserver/lsiodev-buildcache,quay.io/linuxserver.io/lsiodev-buildcache\"\
        \ >> \"$GITHUB_ENV\"\necho \"CITEST_IMAGETAG=develop\" >> \"$GITHUB_ENV\"\n"
    - name: ShellCheck
      if: env.CI == 'true'
      env:
        S3_KEY: ${{ secrets.CI_TESTS_S3_KEY_ID }}
        S3_SECRET: ${{ secrets.CI_TESTS_S3_SECRET_ACCESS_KEY }}
      run: "#! /bin/bash\nset -e\nSHELLCHECK_URL=\"https://ci-tests.linuxserver.io/${IMAGE}/${META_TAG}/shellcheck-result.xml\"\
        \necho \"SHELLCHECK_URL=${SHELLCHECK_URL}\" >> \"$GITHUB_ENV\"\ncurl -sL https://raw.githubusercontent.com/linuxserver/docker-jenkins-builder/master/checkrun.sh\
        \ | /bin/bash\nsource \"${WORKSPACE}/retry_ghcr.sh\"\nretry_ghcr docker pull\
        \ ghcr.io/linuxserver/baseimage-alpine:3.23\ndocker run --rm \\\n  -v \"${WORKSPACE}:/mnt\"\
        \ \\\n  -e AWS_ACCESS_KEY_ID=\"${S3_KEY}\" \\\n  -e AWS_SECRET_ACCESS_KEY=\"\
        ${S3_SECRET}\" \\\n  ghcr.io/linuxserver/baseimage-alpine:3.23 s6-envdir -fn\
        \ -- /var/run/s6/container_environment /bin/bash -c \"\\\n    apk add --no-cache\
        \ python3 && \\\n    python3 -m venv /lsiopy && \\\n    pip install --no-cache-dir\
        \ -U pip && \\\n    pip install --no-cache-dir s3cmd && \\\n    s3cmd put\
        \ --no-preserve --acl-public -m text/xml /mnt/shellcheck-result.xml s3://ci-tests.linuxserver.io/${IMAGE}/${META_TAG}/shellcheck-result.xml\"\
        \ || :\n"
    - name: Update-Templates
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && env.CONTAINER_NAME
        != ''
      run: "#! /bin/bash\nset -e\nTEMPDIR=$(mktemp -d)\nsource ${WORKSPACE}/retry_ghcr.sh\n\
        retry_ghcr docker pull ghcr.io/linuxserver/jenkins-builder:latest\n# Cloned\
        \ repo paths for templating:\n# ${TEMPDIR}/docker-${CONTAINER_NAME}: Cloned\
        \ branch main of ${LS_USER}/${LS_REPO} for running the jenkins builder on\n\
        # ${TEMPDIR}/repo/${LS_REPO}: Cloned branch main of ${LS_USER}/${LS_REPO}\
        \ for commiting various templated file changes and pushing back to Github\n\
        # ${TEMPDIR}/docs/docker-documentation: Cloned docs repo for pushing docs\
        \ updates to Github\n# ${TEMPDIR}/unraid/docker-templates: Cloned docker-templates\
        \ repo to check for logos\n# ${TEMPDIR}/unraid/templates: Cloned templates\
        \ repo for commiting unraid template changes and pushing back to Github\n\
        git clone --branch main --depth 1 https://github.com/${LS_USER}/${LS_REPO}.git\
        \ ${TEMPDIR}/docker-${CONTAINER_NAME}\ndocker run --rm -v ${TEMPDIR}/docker-${CONTAINER_NAME}:/tmp\
        \ -e LOCAL=true -e PUID=$(id -u) -e PGID=$(id -g) ghcr.io/linuxserver/jenkins-builder:latest\
        \ \necho \"Starting Stage 1 - Jenkinsfile update\"\nif [[ \"$(md5sum Jenkinsfile\
        \ | awk '{ print $1 }')\" != \"$(md5sum ${TEMPDIR}/docker-${CONTAINER_NAME}/Jenkinsfile\
        \ | awk '{ print $1 }')\" ]]; then\n  mkdir -p ${TEMPDIR}/repo\n  git clone\
        \ https://github.com/${LS_USER}/${LS_REPO}.git ${TEMPDIR}/repo/${LS_REPO}\n\
        \  cd ${TEMPDIR}/repo/${LS_REPO}\n  git checkout -f main\n  cp ${TEMPDIR}/docker-${CONTAINER_NAME}/Jenkinsfile\
        \ ${TEMPDIR}/repo/${LS_REPO}/\n  git add Jenkinsfile\n  git commit -m 'Bot\
        \ Updating Templated Files'\n  git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  echo \"true\" > /tmp/${COMMIT_SHA}-${BUILD_NUMBER}\n  echo \"Updating\
        \ Jenkinsfile and exiting build, new one will trigger based on commit\"\n\
        \  rm -Rf ${TEMPDIR}\n  exit 0\nelse\n  echo \"Jenkinsfile is up to date.\"\
        \nfi\necho \"Starting Stage 2 - Delete old templates\"\nOLD_TEMPLATES=\".github/ISSUE_TEMPLATE.md\
        \ .github/ISSUE_TEMPLATE/issue.bug.md .github/ISSUE_TEMPLATE/issue.feature.md\
        \ .github/workflows/call_invalid_helper.yml .github/workflows/stale.yml .github/workflows/package_trigger.yml\"\
        \nfor i in ${OLD_TEMPLATES}; do\n  if [[ -f \"${i}\" ]]; then\n    TEMPLATES_TO_DELETE=\"\
        ${i} ${TEMPLATES_TO_DELETE}\"\n  fi\ndone\nif [[ -n \"${TEMPLATES_TO_DELETE}\"\
        \ ]]; then\n  mkdir -p ${TEMPDIR}/repo\n  git clone https://github.com/${LS_USER}/${LS_REPO}.git\
        \ ${TEMPDIR}/repo/${LS_REPO}\n  cd ${TEMPDIR}/repo/${LS_REPO}\n  git checkout\
        \ -f main\n  for i in ${TEMPLATES_TO_DELETE}; do\n    git rm \"${i}\"\n  done\n\
        \  git commit -m 'Bot Updating Templated Files'\n  git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  echo \"true\" > /tmp/${COMMIT_SHA}-${BUILD_NUMBER}\n  echo \"Deleting\
        \ old/deprecated templates and exiting build, new one will trigger based on\
        \ commit\"\n  rm -Rf ${TEMPDIR}\n  exit 0\nelse\n  echo \"No templates to\
        \ delete\"\nfi\necho \"Starting Stage 2.5 - Update init diagram\"\nif ! grep\
        \ -q 'init_diagram:' readme-vars.yml; then\n  echo \"Adding the key 'init_diagram'\
        \ to readme-vars.yml\"\n  sed -i '\\|^#.*changelog.*$|d' readme-vars.yml\n\
        \  sed -i 's|^changelogs:|# init diagram\\ninit_diagram:\\n\\n# changelog\\\
        nchangelogs:|' readme-vars.yml\nfi\nmkdir -p ${TEMPDIR}/d2\nretry_ghcr docker\
        \ pull ghcr.io/linuxserver/d2-builder:latest\ndocker run --rm -v ${TEMPDIR}/d2:/output\
        \ -e PUID=$(id -u) -e PGID=$(id -g) -e RAW=\"true\" ghcr.io/linuxserver/d2-builder:latest\
        \ ${CONTAINER_NAME}:latest\nls -al ${TEMPDIR}/d2\nyq -ei \".init_diagram |=\
        \ load_str(\\\"${TEMPDIR}/d2/${CONTAINER_NAME}-latest.d2\\\")\" readme-vars.yml\n\
        if [[ $(md5sum readme-vars.yml | cut -c1-8) != $(md5sum ${TEMPDIR}/docker-${CONTAINER_NAME}/readme-vars.yml\
