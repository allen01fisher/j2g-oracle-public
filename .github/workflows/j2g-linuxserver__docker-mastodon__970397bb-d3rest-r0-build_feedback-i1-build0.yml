        == ''
      run: '#! /bin/bash

        PACKAGE_UPDATED="$(cat /tmp/packages-${COMMIT_SHA}-${BUILD_NUMBER} 2>/dev/null
        || true)"

        PACKAGE_UPDATED="$(printf ''%s'' "$PACKAGE_UPDATED" | sed -e ''s/^[[:space:]]*//''
        -e ''s/[[:space:]]*$//'')"

        echo "PACKAGE_UPDATED=${PACKAGE_UPDATED}" >> "$GITHUB_ENV"

        '
    - name: PACKAGE-exit
