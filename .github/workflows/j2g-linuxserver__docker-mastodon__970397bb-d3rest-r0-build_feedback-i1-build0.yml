        \ -p ${TEMPDIR}/repo\n  git clone https://github.com/${LS_USER}/${LS_REPO}.git\
        \ ${TEMPDIR}/repo/${LS_REPO}\n  cd ${TEMPDIR}/repo/${LS_REPO}\n  git checkout\
        \ -f main\n  cp ${WORKSPACE}/readme-vars.yml ${TEMPDIR}/repo/${LS_REPO}/readme-vars.yml\n\
        \  git add readme-vars.yml\n  git commit -m 'Bot Updating Templated Files'\n\
        \  git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  echo \"true\" > /tmp/${COMMIT_SHA}-${BUILD_NUMBER}\n  echo \"Updating\
