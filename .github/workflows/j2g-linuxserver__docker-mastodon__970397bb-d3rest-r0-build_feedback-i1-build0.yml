        \ + GITLAB_TIMEOUT ))\n  echo $DOCKERHUB_TOKEN | docker login -u linuxserverci\
        \ --password-stdin\n  echo $GITHUB_TOKEN | docker login ghcr.io -u LinuxServer-CI\
        \ --password-stdin\n  echo $GITLAB_TOKEN | docker login registry.gitlab.com\
        \ -u LinuxServer.io --password-stdin\n  echo $QUAYPASS | docker login quay.io\
        \ -u $QUAYUSER --password-stdin\n  if [[ \"${PACKAGE_CHECK}\" != \"true\"\
        \ ]]; then\n    declare -A pids\n    IFS=',' read -ra CACHE <<< \"$BUILDCACHE\"\
        \n    for i in \"${CACHE[@]}\"; do\n      if [[ \"${i}\" == *\"registry.gitlab.com\"\
        * ]]; then\n        TIMEOUT_CMD=\"gitlab_timeout\"\n      else\n        TIMEOUT_CMD=\"\
        \"\n      fi\n      ${TIMEOUT_CMD} docker push ${i}:amd64-${COMMIT_SHA}-${BUILD_NUMBER}\
        \ &\n      pids[$!]=\"$i\"\n    done\n    for p in \"${!pids[@]}\"; do\n \
        \     wait \"$p\" || { if [[ \"${pids[$p]}\" != *\"quay.io\"* && \"${pids[$p]}\"\
        \ != *\"registry.gitlab.com\"* ]]; then return 1; fi; }\n    done\n  fi\n\
        }\nretry_backoff push_single\n"
