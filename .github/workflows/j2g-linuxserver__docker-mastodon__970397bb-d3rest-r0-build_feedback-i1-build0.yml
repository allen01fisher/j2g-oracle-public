        \  done\n    fi\n  }\n  retry_backoff push_arm64\n  containers=$(docker ps\
        \ -aq)\n  if [[ -n \"${containers}\" ]]; then\n    docker stop ${containers}\n\
        \  fi\n  docker system prune -f --volumes || :\n  docker image prune -af ||\
        \ :\n}\nbuild_x86 & p1=$!\nbuild_arm64 & p2=$!\nstatus=0\nwait -n || status=$?\n\
        if [ $status -ne 0 ]; then\n  kill $p1 $p2 2>/dev/null || true\n  wait $p1\
