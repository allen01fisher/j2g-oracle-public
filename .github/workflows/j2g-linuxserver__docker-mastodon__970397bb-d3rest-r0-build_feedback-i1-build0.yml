        \ $status -ne 0 ]; then\n  kill $p1 $p2 2>/dev/null || true\n  wait $p1 $p2\
        \ 2>/dev/null || true\n  exit $status\nfi\nwait $p1 || exit $?\nwait $p2 ||\
