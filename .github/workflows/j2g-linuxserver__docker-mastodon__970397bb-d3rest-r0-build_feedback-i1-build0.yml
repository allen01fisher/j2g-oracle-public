    - name: Github-Tag-Push-Release
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && env.EXIT_STATUS
        == '' && env.LS_RELEASE != format('{0}-ls{1}', env.EXT_RELEASE_CLEAN, env.LS_TAG_NUMBER)
      run: "#! /bin/bash\nset -e\necho \"Auto-generating release notes\"\nif [ \"\
        $(git tag --points-at HEAD)\" != \"\" ]; then\n  echo \"Existing tag points\
        \ to current commit, suggesting no new LS changes\"\n  AUTO_RELEASE_NOTES=\"\
        No changes\"\nelse\n  AUTO_RELEASE_NOTES=$(curl -fsL -H \"Authorization: token\
        \ ${GITHUB_TOKEN}\" -H \"Accept: application/vnd.github+json\" -X POST https://api.github.com/repos/${LS_USER}/${LS_REPO}/releases/generate-notes\
        \  \\\n    -d '{\"tag_name\":\"'${META_TAG}'\",\\\n        \"target_commitish\"\
        : \"main\"}' \\\n    | jq -r '.body' | sed 's|## What.s Changed||')\nfi\n\
        echo \"Pushing New tag for current commit ${META_TAG}\"\ncurl -H \"Authorization:\
        \ token ${GITHUB_TOKEN}\" -X POST https://api.github.com/repos/${LS_USER}/${LS_REPO}/git/tags\
        \ \\\n  -d '{\"tag\":\"'${META_TAG}'\",\\\n    \"object\": \"'${COMMIT_SHA}'\"\
        ,\\\n    \"message\": \"Tagging Release '${EXT_RELEASE_CLEAN}'-ls'${LS_TAG_NUMBER}'\
        \ to main\",\\\n    \"type\": \"commit\",\\\n    \"tagger\": {\"name\": \"\
        LinuxServer-CI\",\"email\": \"ci@linuxserver.io\",\"date\": \"'${GITHUB_DATE}'\"\
        }}'\necho \"Pushing New release for Tag\"\ncurl -H \"Authorization: token\
        \ ${GITHUB_TOKEN}\" -s https://api.github.com/repos/${EXT_USER}/${EXT_REPO}/releases/latest\
        \ | jq -r '. |.body' > releasebody.json\njq -n \\\n  --arg tag_name \"$META_TAG\"\
        \ \\\n  --arg target_commitish \"main\" \\\n  --arg ci_url \"${CI_URL:-N/A}\"\
        \ \\\n  --arg ls_notes \"$AUTO_RELEASE_NOTES\" \\\n  --arg remote_notes \"\
        $(cat releasebody.json)\" \\\n  '{\n    \"tag_name\": $tag_name,\n    \"target_commitish\"\
        : $target_commitish,\n    \"name\": $tag_name,\n    \"body\": (\"**CI Report:**\\\
        n\\n\" + $ci_url + \"\\n\\n**LinuxServer Changes:**\\n\\n\" + $ls_notes +\
        \ \"\\n\\n**Remote Changes:**\\n\\n\" + $remote_notes),\n    \"draft\": false,\n\
        \    \"prerelease\": false                }' > releasebody.json.done\ncurl\
        \ -H \"Authorization: token ${GITHUB_TOKEN}\" -X POST https://api.github.com/repos/${LS_USER}/${LS_REPO}/releases\
        \ -d @releasebody.json.done\n"
    - name: Github-Release-Branch-Protection
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && env.EXIT_STATUS
        == ''
      run: "#! /bin/bash\necho \"Setting up protection for release branch main\"\n\
