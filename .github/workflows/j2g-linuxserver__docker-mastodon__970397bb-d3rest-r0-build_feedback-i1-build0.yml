    - name: Docker-Push-Single
      if: env.MULTIARCH == 'false' && env.EXIT_STATUS == ''
      run: "#! /bin/bash\nset -e\necho \"PUSH_ATTEMPTED=true\" >> \"$GITHUB_ENV\"\n\
        retry_backoff() {\n  local max_attempts=5 delay=5 attempt=1\n  while true;\
        \ do\n    \"$@\" && return 0\n    if (( attempt >= max_attempts )); then return\
        \ 1; fi\n    sleep \"$delay\"\n    ((attempt++))\n  done\n}\npush_single()\
        \ {\n  set -e\n  gitlab_timeout() {\n    local remaining=$(( GITLAB_DEADLINE\
        \ - SECONDS ))\n    if (( remaining <= 0 )); then\n      echo \"gitlab timeout\
