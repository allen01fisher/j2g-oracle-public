        \    fi\n    timeout \"${remaining}\" \"$@\"\n  }\n  GITLAB_DEADLINE=$(( SECONDS\
        \ + GITLAB_TIMEOUT ))\n  for PUSHIMAGE in \"${IMAGE}\" \"${GITLABIMAGE}\"\
        \ \"${GITHUBIMAGE}\" \"${QUAYIMAGE}\"; do\n    if [[ \"${PUSHIMAGE}\" == \"\
        ${GITLABIMAGE}\" ]]; then\n      TIMEOUT_CMD=\"gitlab_timeout\"\n    else\n\
        \      TIMEOUT_CMD=\"\"\n    fi\n    [[ ${PUSHIMAGE%%/*} =~ \\. ]] && PUSHIMAGEPLUS=\"\
        ${PUSHIMAGE}\" || PUSHIMAGEPLUS=\"docker.io/${PUSHIMAGE}\"\n    IFS=',' read\
        \ -ra CACHE <<< \"$BUILDCACHE\"\n    for i in \"${CACHE[@]}\"; do\n      if\
        \ [[ \"${PUSHIMAGEPLUS}\" == \"$(cut -d \"/\" -f1 <<< ${i})\"* ]]; then\n\
        \        CACHEIMAGE=${i}\n      fi\n    done\n    ${TIMEOUT_CMD} docker buildx\
        \ imagetools create --prefer-index=false -t ${PUSHIMAGE}:${META_TAG} -t ${PUSHIMAGE}:latest\
        \ -t ${PUSHIMAGE}:${EXT_RELEASE_TAG} ${CACHEIMAGE}:amd64-${COMMIT_SHA}-${BUILD_NUMBER}\
        \ || \\\n      { if [[ \"${PUSHIMAGE}\" != \"${QUAYIMAGE}\" && \"${PUSHIMAGE}\"\
        \ != \"${GITLABIMAGE}\" ]]; then return 1; fi; }\n    if [ -n \"${SEMVER}\"\
        \ ]; then\n      ${TIMEOUT_CMD} docker buildx imagetools create --prefer-index=false\
        \ -t ${PUSHIMAGE}:${SEMVER} ${CACHEIMAGE}:amd64-${COMMIT_SHA}-${BUILD_NUMBER}\
        \ || \\\n        { if [[ \"${PUSHIMAGE}\" != \"${QUAYIMAGE}\" && \"${PUSHIMAGE}\"\
        \ != \"${GITLABIMAGE}\" ]]; then return 1; fi; }\n    fi\n  done\n}\nretry_backoff\
        \ push_single\n"
    - name: Docker-Push-Multi
      if: env.MULTIARCH == 'true' && env.EXIT_STATUS == ''
      run: "#! /bin/bash\nset -e\necho \"PUSH_ATTEMPTED=true\" >> \"$GITHUB_ENV\"\n\
        retry_backoff() {\n  local max_attempts=5 delay=5 attempt=1\n  while true;\
        \ do\n    \"$@\" && return 0\n    if (( attempt >= max_attempts )); then return\
