        \ | md5sum | cut -c1-8)\nif [[ \"${CURRENTHASH}\" != \"${NEWHASH}\" ]] ||\
        \ ! grep -q '.jenkins-external' \"${WORKSPACE}/.gitignore\" 2>/dev/null; then\n\
        \  mkdir -p ${TEMPDIR}/repo\n  git clone https://github.com/${LS_USER}/${LS_REPO}.git\
        \ ${TEMPDIR}/repo/${LS_REPO}\n  cd ${TEMPDIR}/repo/${LS_REPO}\n  git checkout\
        \ -f main\n  cd ${TEMPDIR}/docker-${CONTAINER_NAME}\n  mkdir -p ${TEMPDIR}/repo/${LS_REPO}/.github/workflows\n\
        \  mkdir -p ${TEMPDIR}/repo/${LS_REPO}/.github/ISSUE_TEMPLATE\n  cp --parents\
        \ ${TEMPLATED_FILES} ${TEMPDIR}/repo/${LS_REPO}/ || :\n  cp --parents readme-vars.yml\
        \ ${TEMPDIR}/repo/${LS_REPO}/ || :\n  cd ${TEMPDIR}/repo/${LS_REPO}/\n  if\
        \ ! grep -q '.jenkins-external' .gitignore 2>/dev/null; then\n    echo \"\
        .jenkins-external\" >> .gitignore\n    git add .gitignore\n  fi\n  git add\
        \ readme-vars.yml ${TEMPLATED_FILES}\n  git commit -m 'Bot Updating Templated\
        \ Files'\n  git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  echo \"true\" > /tmp/${COMMIT_SHA}-${BUILD_NUMBER}\n  echo \"Updating\
        \ templates and exiting build, new one will trigger based on commit\"\n  rm\
        \ -Rf ${TEMPDIR}\n  exit 0\nelse\n  echo \"false\" > /tmp/${COMMIT_SHA}-${BUILD_NUMBER}\n\
        \  echo \"No templates to update\"\nfi\necho \"Starting Stage 4 - External\
        \ repo updates: Docs, Unraid Template and Readme Sync to Docker Hub\"\nmkdir\
        \ -p ${TEMPDIR}/docs\ngit clone --depth=1 https://github.com/linuxserver/docker-documentation.git\
        \ ${TEMPDIR}/docs/docker-documentation\nif [[ \"${BRANCH_NAME}\" == \"${GH_DEFAULT_BRANCH}\"\
        \  ]] && [[ (! -f ${TEMPDIR}/docs/docker-documentation/docs/images/docker-${CONTAINER_NAME}.md)\
        \ || (\"$(md5sum ${TEMPDIR}/docs/docker-documentation/docs/images/docker-${CONTAINER_NAME}.md\
        \ | awk '{ print $1 }')\" != \"$(md5sum ${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/docker-${CONTAINER_NAME}.md\
        \ | awk '{ print $1 }')\") ]]; then\n  cp ${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/docker-${CONTAINER_NAME}.md\
        \ ${TEMPDIR}/docs/docker-documentation/docs/images/\n  cd ${TEMPDIR}/docs/docker-documentation\n\
        \  GH_DOCS_DEFAULT_BRANCH=$(git remote show origin | grep \"HEAD branch:\"\
        \ | sed 's|.*HEAD branch: ||')\n  git add docs/images/docker-${CONTAINER_NAME}.md\n\
        \  echo \"Updating docs repo\"\n  git commit -m 'Bot Updating Documentation'\n\
        \  git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/docker-documentation.git\
        \ ${GH_DOCS_DEFAULT_BRANCH} --rebase\n  git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/docker-documentation.git\
        \ ${GH_DOCS_DEFAULT_BRANCH} || \\\n    (MAXWAIT=\"10\" && echo \"Push to docs\
        \ failed, trying again in ${MAXWAIT} seconds\" && \\\n    sleep $((RANDOM\
        \ % MAXWAIT)) && \\\n    git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/docker-documentation.git\
        \ ${GH_DOCS_DEFAULT_BRANCH} --rebase && \\\n    git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/docker-documentation.git\
        \ ${GH_DOCS_DEFAULT_BRANCH})\nelse\n  echo \"Docs update not needed, skipping\"\
        \nfi\nmkdir -p ${TEMPDIR}/unraid\ngit clone --depth=1 https://github.com/linuxserver/docker-templates.git\
        \ ${TEMPDIR}/unraid/docker-templates\ngit clone --depth=1 https://github.com/linuxserver/templates.git\
        \ ${TEMPDIR}/unraid/templates\nif [[ -f ${TEMPDIR}/unraid/docker-templates/linuxserver.io/img/${CONTAINER_NAME}-logo.png\
        \ ]]; then\n  sed -i \"s|master/linuxserver.io/img/linuxserver-ls-logo.png|master/linuxserver.io/img/${CONTAINER_NAME}-logo.png|\"\
        \ ${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/${CONTAINER_NAME}.xml\n\
        elif [[ -f ${TEMPDIR}/unraid/docker-templates/linuxserver.io/img/${CONTAINER_NAME}-icon.png\
        \ ]]; then\n  sed -i \"s|master/linuxserver.io/img/linuxserver-ls-logo.png|master/linuxserver.io/img/${CONTAINER_NAME}-icon.png|\"\
        \ ${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/${CONTAINER_NAME}.xml\n\
        fi\nif [[ \"${BRANCH_NAME}\" == \"${GH_DEFAULT_BRANCH}\" ]] && [[ (! -f ${TEMPDIR}/unraid/templates/unraid/${CONTAINER_NAME}.xml)\
        \ || (\"$(md5sum ${TEMPDIR}/unraid/templates/unraid/${CONTAINER_NAME}.xml\
        \ | awk '{ print $1 }')\" != \"$(md5sum ${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/${CONTAINER_NAME}.xml\
        \ | awk '{ print $1 }')\") ]]; then\n  echo \"Updating Unraid template\"\n\
        \  cd ${TEMPDIR}/unraid/templates/\n  GH_TEMPLATES_DEFAULT_BRANCH=$(git remote\
        \ show origin | grep \"HEAD branch:\" | sed 's|.*HEAD branch: ||')\n  if grep\
        \ -wq \"^${CONTAINER_NAME}$\" ${TEMPDIR}/unraid/templates/unraid/ignore.list\
        \ && [[ -f ${TEMPDIR}/unraid/templates/unraid/deprecated/${CONTAINER_NAME}.xml\
        \ ]]; then\n    echo \"Image is on the ignore list, and already in the deprecation\
        \ folder.\"\n  elif grep -wq \"^${CONTAINER_NAME}$\" ${TEMPDIR}/unraid/templates/unraid/ignore.list;\
        \ then\n    echo \"Image is on the ignore list, marking Unraid template as\
        \ deprecated\"\n    cp ${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/${CONTAINER_NAME}.xml\
        \ ${TEMPDIR}/unraid/templates/unraid/\n    git add -u unraid/${CONTAINER_NAME}.xml\n\
        \    git mv unraid/${CONTAINER_NAME}.xml unraid/deprecated/${CONTAINER_NAME}.xml\
        \ || :\n    git commit -m 'Bot Moving Deprecated Unraid Template' || :\n \
        \ else\n    cp ${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/${CONTAINER_NAME}.xml\
        \ ${TEMPDIR}/unraid/templates/unraid/\n    git add unraid/${CONTAINER_NAME}.xml\n\
        \    git commit -m 'Bot Updating Unraid Template'\n  fi\n  git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/templates.git\
        \ ${GH_TEMPLATES_DEFAULT_BRANCH} --rebase\n  git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/templates.git\
        \ ${GH_TEMPLATES_DEFAULT_BRANCH} || \\\n    (MAXWAIT=\"10\" && echo \"Push\
        \ to unraid templates failed, trying again in ${MAXWAIT} seconds\" && \\\n\
        \    sleep $((RANDOM % MAXWAIT)) && \\\n    git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/templates.git\
        \ ${GH_TEMPLATES_DEFAULT_BRANCH} --rebase && \\\n    git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/linuxserver/templates.git\
        \ ${GH_TEMPLATES_DEFAULT_BRANCH})\nelse\n  echo \"No updates to Unraid template\
        \ needed, skipping\"\nfi\nif [[ \"${BRANCH_NAME}\" == \"${GH_DEFAULT_BRANCH}\"\
        \ ]]; then\n  if [[ $(cat ${TEMPDIR}/docker-${CONTAINER_NAME}/README.md |\
        \ wc -m) -gt 25000 ]]; then\n    echo \"Readme is longer than 25,000 characters.\
        \ Syncing the lite version to Docker Hub\"\n    DH_README_SYNC_PATH=\"${TEMPDIR}/docker-${CONTAINER_NAME}/.jenkins-external/README.lite\"\
        \n  else\n    echo \"Syncing readme to Docker Hub\"\n    DH_README_SYNC_PATH=\"\
        ${TEMPDIR}/docker-${CONTAINER_NAME}/README.md\"\n  fi\n  if curl -s https://hub.docker.com/v2/namespaces/${DOCKERHUB_IMAGE%%/*}/repositories/${DOCKERHUB_IMAGE##*/}/tags\
        \ | jq -r '.message' | grep -q 404; then\n    echo \"Docker Hub endpoint doesn't\
        \ exist. Creating endpoint first.\"\n    DH_TOKEN=$(curl -d '{\"username\"\
        :\"linuxserverci\", \"password\":\"'${DOCKERHUB_TOKEN}'\"}' -H \"Content-Type:\
        \ application/json\" -X POST https://hub.docker.com/v2/users/login | jq -r\
        \ '.token')\n    curl -s \\\n      -H \"Authorization: JWT ${DH_TOKEN}\" \\\
        \n      -H \"Content-Type: application/json\" \\\n      -X POST \\\n     \
        \ -d '{\"name\":\"'${DOCKERHUB_IMAGE##*/}'\", \"namespace\":\"'${DOCKERHUB_IMAGE%%/*}'\"\
        }' \\\n      https://hub.docker.com/v2/repositories/ || :\n  fi\n  DH_TOKEN=$(curl\
        \ -d '{\"username\":\"linuxserverci\", \"password\":\"'${DOCKERHUB_TOKEN}'\"\
        }' -H \"Content-Type: application/json\" -X POST https://hub.docker.com/v2/users/login\
        \ | jq -r '.token')\n  curl -s \\\n    -H \"Authorization: JWT ${DH_TOKEN}\"\
        \ \\\n    -H \"Content-Type: application/json\" \\\n    -X PATCH \\\n    -d\
        \ \"{\\\"full_description\\\":$(jq -Rsa . ${DH_README_SYNC_PATH})}\" \\\n\
        \    https://hub.docker.com/v2/repositories/${DOCKERHUB_IMAGE} || :\nelse\n\
        \  echo \"Not the default Github branch. Skipping readme sync to Docker Hub.\"\
        \nfi\nrm -Rf ${TEMPDIR}\n"
    - name: Read FILES_UPDATED
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && env.CONTAINER_NAME
        != ''
      run: '#! /bin/bash

        FILES_UPDATED="$(cat /tmp/${COMMIT_SHA}-${BUILD_NUMBER} 2>/dev/null || true)"

        FILES_UPDATED="$(printf ''%s'' "$FILES_UPDATED" | sed -e ''s/^[[:space:]]*//''
        -e ''s/[[:space:]]*$//'')"

        echo "FILES_UPDATED=${FILES_UPDATED}" >> "$GITHUB_ENV"

        '
    - name: Template-exit
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && env.FILES_UPDATED
        == 'true' && env.CONTAINER_NAME != ''
      run: echo "EXIT_STATUS=ABORTED" >> "$GITHUB_ENV"
    - name: Check S6 Service file Permissions
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && env.EXIT_STATUS
        == ''
      run: "#! /bin/bash\nWRONG_PERM=$(find ./  -path \"./.git\" -prune -o \\( -name\
        \ \"run\" -o -name \"finish\" -o -name \"check\" \\) -not -perm -u=x,g=x,o=x\
        \ -print)\nif [[ -n \"${WRONG_PERM}\" ]]; then\n  echo \"The following S6\
        \ service files are missing the executable bit; canceling the faulty build:\
        \ ${WRONG_PERM}\"\n  exit 1\nelse\n  echo \"S6 service file perms look good.\"\
        \nfi\n"
    - name: GitLab Mirror and Quay.io Visibility
      if: env.EXIT_STATUS == ''
      run: "#! /bin/bash\ncurl -H \"Content-Type: application/json\" -H \"Private-Token:\
        \ ${GITLAB_TOKEN}\" -X POST https://gitlab.com/api/v4/projects \\\n  -d '{\"\
        namespace_id\":'${GITLAB_NAMESPACE}',\\\n    \"name\":\"'${LS_REPO}'\",\n\
        \    \"mirror\":true,\\\n    \"import_url\":\"https://github.com/linuxserver/'${LS_REPO}'.git\"\
        ,\\\n    \"issues_access_level\":\"disabled\",\\\n    \"merge_requests_access_level\"\
        :\"disabled\",\\\n    \"repository_access_level\":\"enabled\",\\\n    \"visibility\"\
        :\"public\"}' \ncurl -H \"Private-Token: ${GITLAB_TOKEN}\" -X PUT \"https://gitlab.com/api/v4/projects/Linuxserver.io%2F${LS_REPO}\"\
        \ \\\n  -d \"mirror=true&import_url=https://github.com/linuxserver/${LS_REPO}.git\"\
        \ncurl -H \"Content-Type: application/json\" -H \"Authorization: Bearer ${QUAYIO_API_TOKEN}\"\
        \ -X POST \"https://quay.io/api/v1/repository${QUAYIMAGE/quay.io/}/changevisibility\"\
        \ \\\n  -d '{\"visibility\":\"public\"}' ||:\n"
    - name: Build-Single
      if: (env.MULTIARCH == 'false' || env.PACKAGE_CHECK == 'true') && env.EXIT_STATUS
        == ''
      run: "#! /bin/bash\nset -e\necho \"Running on node: ${NODE_NAME}\"\nsed -r -i\
        \ 's|(^FROM .*)|\\1\\n\\nENV LSIO_FIRST_PARTY=true|g' Dockerfile\nsource \"\
        ${WORKSPACE}/retry_ghcr.sh\"\nretry_ghcr docker buildx build \\\n  --label\
        \ \"org.opencontainers.image.created=${GITHUB_DATE}\" \\\n  --label \"org.opencontainers.image.authors=linuxserver.io\"\
        \ \\\n  --label \"org.opencontainers.image.url=https://github.com/linuxserver/docker-mastodon/packages\"\
        \ \\\n  --label \"org.opencontainers.image.documentation=https://docs.linuxserver.io/images/docker-mastodon\"\
        \ \\\n  --label \"org.opencontainers.image.source=https://github.com/linuxserver/docker-mastodon\"\
        \ \\\n  --label \"org.opencontainers.image.version=${EXT_RELEASE_CLEAN}-ls${LS_TAG_NUMBER}\"\
        \ \\\n  --label \"org.opencontainers.image.revision=${COMMIT_SHA}\" \\\n \
        \ --label \"org.opencontainers.image.vendor=linuxserver.io\" \\\n  --label\
        \ \"org.opencontainers.image.licenses=GPL-3.0-only\" \\\n  --label \"org.opencontainers.image.ref.name=${COMMIT_SHA}\"\
        \ \\\n  --label \"org.opencontainers.image.title=Mastodon\" \\\n  --label\
        \ \"org.opencontainers.image.description=[Mastodon](https://github.com/mastodon/mastodon/)\
        \ is a free, open-source social network server based on ActivityPub where\
        \ users can follow friends and discover new ones..  \" \\\n  --no-cache --pull\
        \ -t ${IMAGE}:${META_TAG} --platform=linux/amd64 \\\n  --provenance=true --sbom=true\
        \ --builder=default --load \\\n  --build-arg ${BUILD_VERSION_ARG}=${EXT_RELEASE}\
        \ --build-arg VERSION=\"${VERSION_TAG}\" --build-arg BUILD_DATE=${GITHUB_DATE}\
        \ .\nIFS=',' read -ra CACHE <<< \"$BUILDCACHE\"\nfor i in \"${CACHE[@]}\"\
        ; do\n  docker tag ${IMAGE}:${META_TAG} ${i}:amd64-${COMMIT_SHA}-${BUILD_NUMBER}\n\
        done\nretry_backoff() {\n  local max_attempts=5 delay=5 attempt=1\n  while\
        \ true; do\n    \"$@\" && return 0\n    if (( attempt >= max_attempts ));\
        \ then return 1; fi\n    sleep \"$delay\"\n    ((attempt++))\n  done\n}\n\
        push_single() {\n  set -e\n  gitlab_timeout() {\n    local remaining=$(( GITLAB_DEADLINE\
