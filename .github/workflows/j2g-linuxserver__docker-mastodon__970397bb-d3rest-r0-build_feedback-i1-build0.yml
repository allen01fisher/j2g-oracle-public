    - name: Update-packages
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && env.EXIT_STATUS
        == ''
      run: "#! /bin/bash\nset -e\nTEMPDIR=$(mktemp -d)\nif [ \"${MULTIARCH}\" == \"\
        true\" ] && [ \"${PACKAGE_CHECK}\" != \"true\" ]; then\n  LOCAL_CONTAINER=${IMAGE}:amd64-${META_TAG}\n\
        else\n  LOCAL_CONTAINER=${IMAGE}:${META_TAG}\nfi\ntouch ${TEMPDIR}/package_versions.txt\n\
        source ${WORKSPACE}/retry_ghcr.sh\nretry_ghcr docker pull ghcr.io/anchore/syft:${SYFT_IMAGE_TAG}\n\
        docker run --rm \\\n  -v /var/run/docker.sock:/var/run/docker.sock:ro \\\n\
        \  -v ${TEMPDIR}:/tmp \\\n  ghcr.io/anchore/syft:${SYFT_IMAGE_TAG} \\\n  ${LOCAL_CONTAINER}\
        \ -o table=/tmp/package_versions.txt\nNEW_PACKAGE_TAG=$(md5sum ${TEMPDIR}/package_versions.txt\
        \ | cut -c1-8 )\necho \"Package tag sha from current packages in buit container\
        \ is ${NEW_PACKAGE_TAG} comparing to old ${PACKAGE_TAG} from github\"\nif\
        \ [ \"${NEW_PACKAGE_TAG}\" != \"${PACKAGE_TAG}\" ]; then\n  git clone https://github.com/${LS_USER}/${LS_REPO}.git\
        \ ${TEMPDIR}/${LS_REPO}\n  git --git-dir ${TEMPDIR}/${LS_REPO}/.git checkout\
        \ -f main\n  cp ${TEMPDIR}/package_versions.txt ${TEMPDIR}/${LS_REPO}/\n \
        \ cd ${TEMPDIR}/${LS_REPO}/\n  wait\n  git add package_versions.txt\n  git\
        \ commit -m 'Bot Updating Package Versions'\n  git pull https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  git push https://LinuxServer-CI:${GITHUB_TOKEN}@github.com/${LS_USER}/${LS_REPO}.git\
        \ main\n  echo \"true\" > /tmp/packages-${COMMIT_SHA}-${BUILD_NUMBER}\n  echo\
        \ \"Package tag updated, stopping build process\"\nelse\n  echo \"false\"\
        \ > /tmp/packages-${COMMIT_SHA}-${BUILD_NUMBER}\n  echo \"Package tag is same\
        \ as previous continue with build process\"\nfi\nrm -Rf ${TEMPDIR}\n"
    - name: Read PACKAGE_UPDATED
