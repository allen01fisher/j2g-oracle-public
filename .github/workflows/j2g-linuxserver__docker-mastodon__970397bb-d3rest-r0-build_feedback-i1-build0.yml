        \     if [[ \"${MANIFESTIMAGEPLUS}\" == \"$(cut -d \"/\" -f1 <<< ${i})\"*\
        \ ]]; then\n        CACHEIMAGE=${i}\n      fi\n    done\n    ${TIMEOUT_CMD}\
        \ docker buildx imagetools create --prefer-index=false -t ${MANIFESTIMAGE}:amd64-${META_TAG}\
