        \ \\\n    --label \"org.opencontainers.image.documentation=https://docs.linuxserver.io/images/docker-mastodon\"\
        \ \\\n    --label \"org.opencontainers.image.source=https://github.com/linuxserver/docker-mastodon\"\
        \ \\\n    --label \"org.opencontainers.image.version=${EXT_RELEASE_CLEAN}-ls${LS_TAG_NUMBER}\"\
        \ \\\n    --label \"org.opencontainers.image.revision=${COMMIT_SHA}\" \\\n\
        \    --label \"org.opencontainers.image.vendor=linuxserver.io\" \\\n    --label\
        \ \"org.opencontainers.image.licenses=GPL-3.0-only\" \\\n    --label \"org.opencontainers.image.ref.name=${COMMIT_SHA}\"\
        \ \\\n    --label \"org.opencontainers.image.title=Mastodon\" \\\n    --label\
        \ \"org.opencontainers.image.description=[Mastodon](https://github.com/mastodon/mastodon/)\
        \ is a free, open-source social network server based on ActivityPub where\
