        \    \"block_creations\": false,\n    \"required_conversation_resolution\"\
        : true,\n    \"lock_branch\": false,\n    \"allow_fork_syncing\": false,\n\
        \    \"required_signatures\": false\n  }\nEOF\n)\n"
    - name: Post always
      if: always()
      run: j2g_op post_always
