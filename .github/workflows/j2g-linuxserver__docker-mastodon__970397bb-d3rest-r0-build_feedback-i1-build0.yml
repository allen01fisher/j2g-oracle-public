        \ --pull -f Dockerfile.aarch64 -t ${IMAGE}:arm64v8-${META_TAG} --platform=linux/arm64\
        \ \\\n    --provenance=true --sbom=true --builder=default --load \\\n    --build-arg\
        \ ${BUILD_VERSION_ARG}=${EXT_RELEASE} --build-arg VERSION=\"${VERSION_TAG}\"\
        \ --build-arg BUILD_DATE=${GITHUB_DATE} .\n  IFS=',' read -ra CACHE <<< \"\
        $BUILDCACHE\"\n  for i in \"${CACHE[@]}\"; do\n    docker tag ${IMAGE}:arm64v8-${META_TAG}\
        \ ${i}:arm64v8-${COMMIT_SHA}-${BUILD_NUMBER}\n  done\n  push_arm64() {\n \
        \   set -e\n    gitlab_timeout() {\n      local remaining=$(( GITLAB_DEADLINE\
        \ - SECONDS ))\n      if (( remaining <= 0 )); then\n        echo \"gitlab\
        \ timeout budget of ${GITLAB_TIMEOUT}s used up, skipping: $*\" >&2\n     \
        \   return 124\n      fi\n      timeout \"${remaining}\" \"$@\"\n    }\n \
        \   GITLAB_DEADLINE=$(( SECONDS + GITLAB_TIMEOUT ))\n    echo $DOCKERHUB_TOKEN\
        \ | docker login -u linuxserverci --password-stdin\n    echo $GITHUB_TOKEN\
        \ | docker login ghcr.io -u LinuxServer-CI --password-stdin\n    echo $GITLAB_TOKEN\
        \ | docker login registry.gitlab.com -u LinuxServer.io --password-stdin\n\
        \    echo $QUAYPASS | docker login quay.io -u $QUAYUSER --password-stdin\n\
        \    if [[ \"${PACKAGE_CHECK}\" != \"true\" ]]; then\n      declare -A pids\n\
        \      IFS=',' read -ra CACHE <<< \"$BUILDCACHE\"\n      for i in \"${CACHE[@]}\"\
        ; do\n        if [[ \"${i}\" == *\"registry.gitlab.com\"* ]]; then\n     \
        \     TIMEOUT_CMD=\"gitlab_timeout\"\n        else\n          TIMEOUT_CMD=\"\
