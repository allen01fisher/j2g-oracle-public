      if: steps.post_build.outputs.unstable == 'true'
    - name: sh
      shell: bash
      run: j2g_op post_failure
      if: steps.post_build.outputs.failure == 'true'
    - name: sh
      shell: bash
      run: j2g_op post_success
      if: steps.post_build.outputs.success == 'true'
    - name: sh
      shell: bash
      run: j2g_op post_always --writes **/target/*.jar,**/build/**
      if: always()
'on':
  workflow_dispatch: null
