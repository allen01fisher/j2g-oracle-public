    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: snapshot post build workflow status
      run: 'echo "success=${{ contains(needs.*.result,''success'') && !contains(needs.*.result,''cancelled'')
        && !contains(needs.*.result,''failure'') }}" >> $GITHUB_OUTPUT

        echo "failure=${{ contains(needs.*.result,''failure'') && !contains(needs.*.result,''cancelled'')
        }}" >> $GITHUB_OUTPUT'
      id: post_build
    - name: sh
      shell: bash
      run: j2g_op post_failure
      if: steps.post_build.outputs.failure == 'true'
    - name: sh
      shell: bash
      run: j2g_op post_success
      if: steps.post_build.outputs.success == 'true'
    - name: sh
      shell: bash
      run: j2g_op post_always
      if: always()
'on':
