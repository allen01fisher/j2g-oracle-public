name: CI
concurrency:
  group: j2g-HarshitManhas__3-tier-devsecops__095f8c6a-rehearsal2-r0-t0-h2-${{ github.workflow
    }}-${{ github.ref }}
  cancel-in-progress: false
env:
  DOCKERHUB_CREDENTIALS: j2g-redacted
  DOCKERHUB_USERNAME: j2g-redacted
  APP_NAME: j2g-redacted
  FRONTEND_REPO: j2g-redacted
  BACKEND_REPO: j2g-redacted
  IMAGE_TAG: j2g-redacted
  AWS_REGION: j2g-redacted
  SONAR_PROJECT_KEY: j2g-redacted
  GITOPS_BRANCH: j2g-redacted
  J2G_RUN_ID: HarshitManhas__3-tier-devsecops__095f8c6a-rehearsal2-r0-t0-h2
  J2G_SCENARIO_ID: HarshitManhas__3-tier-devsecops__095f8c6a-rehearsal2-r0-t0-h2
  J2G_FAULTS: trivy_filesystem_scan
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@v4
    - name: Gitleaks Secret Scan
      id: gitleaks
      run: j2g_op gitleaks_secret_scan
    - name: Gitleaks Secret Scan Post Always
      if: ${{ always() && steps.gitleaks.outcome != 'skipped' }}
      run: j2g_op gitleaks_secret_scan_post_always --writes gitleaks-report.json
    - name: Install Dependencies
      id: install_deps
      run: "set +e\nj2g_op backend_deps &\nbackend_pid=$!\nj2g_op frontend_deps &\n\
        frontend_pid=$!\nwait $backend_pid\nbackend_status=$?\nwait $frontend_pid\n\
        frontend_status=$?\nif [ $backend_status -ne 0 ] || [ $frontend_status -ne\
        \ 0 ]; then\n  exit 1\nfi\n"
    - name: Unit Tests
      id: unit_tests
      run: j2g_op unit_tests
    - name: Unit Tests Post Always
      if: ${{ always() && steps.unit_tests.outcome != 'skipped' }}
      run: j2g_op unit_tests_post_always --writes api/coverage/**
    - name: SonarQube Analysis
      id: sonarqube_analysis
      run: j2g_op sonarqube_analysis
    - name: SonarQube Quality Gate
      id: sonarqube_quality_gate
      run: j2g_op sonarqube_quality_gate
    - name: Trivy Filesystem Scan
      id: trivy_fs
      run: j2g_op trivy_filesystem_scan
    - name: Trivy Filesystem Scan Post Always
      if: ${{ always() && steps.trivy_fs.outcome != 'skipped' }}
      run: j2g_op trivy_filesystem_scan_post_always --writes trivy-fs-report.txt
    - name: Build Docker Images
      id: build_images
      run: "set +e\nj2g_op build_frontend &\nfrontend_pid=$!\nj2g_op build_backend\
        \ &\nbackend_pid=$!\nwait $frontend_pid\nfrontend_status=$?\nwait $backend_pid\n\
        backend_status=$?\nif [ $frontend_status -ne 0 ] || [ $backend_status -ne\
        \ 0 ]; then\n  exit 1\nfi\n"
    - name: Trivy Image Scan
      id: trivy_image_scan
      run: "set +e\nj2g_op scan_frontend_image &\nfrontend_pid=$!\nj2g_op scan_backend_image\
        \ &\nbackend_pid=$!\nwait $frontend_pid\nfrontend_status=$?\nwait $backend_pid\n\
        backend_status=$?\nif [ $frontend_status -ne 0 ] || [ $backend_status -ne\
        \ 0 ]; then\n  exit 1\nfi\n"
    - name: Trivy Image Scan Post Always
      if: ${{ always() && steps.trivy_image_scan.outcome != 'skipped' }}
      run: "set +e\nj2g_op scan_frontend_image_post_always --writes trivy-frontend-image.txt\n\
        frontend_post_status=$?\nj2g_op scan_backend_image_post_always --writes trivy-backend-image.txt\n\
        backend_post_status=$?\nif [ $frontend_post_status -ne 0 ] || [ $backend_post_status\
        \ -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Push to DockerHub
      id: push_dockerhub
      run: j2g_op push_to_dockerhub
    - name: Update GitOps Repo
      id: update_gitops
      run: j2g_op update_gitops_repo
    - name: Post Success
      if: ${{ steps.update_gitops.outcome == 'success' }}
      run: j2g_op post_success
    - name: Post Failure
      if: ${{ !cancelled() && (steps.update_gitops.outcome == 'failure' || steps.update_gitops.outcome
        == 'skipped') }}
      run: j2g_op post_failure
    - name: Post Always
      if: ${{ always() }}
      run: j2g_op post_always
'on':
  workflow_dispatch: null
