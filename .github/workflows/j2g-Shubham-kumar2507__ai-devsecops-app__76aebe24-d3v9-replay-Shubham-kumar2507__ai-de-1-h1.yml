name: CI/CD Pipeline
env:
  DOCKER_REGISTRY: j2g-redacted
  DOCKER_CREDENTIALS: j2g-redacted
  IMAGE_PREFIX: j2g-redacted
  SONARQUBE_URL: j2g-redacted
  SONARQUBE_TOKEN: j2g-redacted
  KUBECONFIG: j2g-redacted
  K8S_NAMESPACE_STG: j2g-redacted
  K8S_NAMESPACE_PROD: j2g-redacted
  SLACK_WEBHOOK: j2g-redacted
  BUILD_TAG: j2g-redacted
  BACKEND_IMAGE: j2g-redacted
  FRONTEND_IMAGE: j2g-redacted
  J2G_RUN_ID: Shubham-kumar2507__ai-devsecops-app__76aebe24-d3v9-replay-Shubham-kumar2507__ai-de-1-h1
  J2G_SCENARIO_ID: Shubham-kumar2507__ai-devsecops-app__76aebe24-d3v9-replay-Shubham-kumar2507__ai-de-1-h1
  J2G_FAULTS: scan_frontend_image
concurrency:
  group: j2g-Shubham-kumar2507__ai-devsecops-app__76aebe24-d3v9-replay-Shubham-kumar2507__ai-de-1-h1-${{
    github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      run: j2g_op checkout
    - name: Install Dependencies
      run: 'set +e

        j2g_op backend_deps & pid1=$!

        j2g_op frontend_deps & pid2=$!

        wait $pid1; status1=$?

        wait $pid2; status2=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then exit 1; fi

        '
    - name: Lint
      run: 'set +e

        j2g_op lint_backend & pid1=$!

        j2g_op lint_frontend & pid2=$!

        wait $pid1; status1=$?

        wait $pid2; status2=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then exit 1; fi

        '
    - name: Unit Tests
      run: 'set +e

        (j2g_op test_backend; status=$?; j2g_op test_backend_post_always; post_status=$?;
        if [ $status -ne 0 ]; then exit $status; else exit $post_status; fi) & pid1=$!

        (j2g_op test_frontend; status=$?; j2g_op test_frontend_post_always; post_status=$?;
        if [ $status -ne 0 ]; then exit $status; else exit $post_status; fi) & pid2=$!

        wait $pid1; status1=$?

        wait $pid2; status2=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then exit 1; fi

        '
    - name: "SAST \u2014 SonarQube"
      id: sast
      run: j2g_op sast_sonarqube
    - name: "SAST \u2014 SonarQube Post Always"
      if: always() && steps.sast.outcome != 'skipped'
      run: j2g_op sast_sonarqube_post_always
    - name: Docker Build
      run: 'set +e

        j2g_op build_backend_image & pid1=$!

        j2g_op build_frontend_image & pid2=$!

        wait $pid1; status1=$?

        wait $pid2; status2=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then exit 1; fi

        '
    - name: "Container Scan \u2014 Trivy"
      run: 'set +e

        j2g_op scan_backend_image & pid1=$!

        j2g_op scan_frontend_image & pid2=$!

        j2g_op filesystem_secret_scan & pid3=$!

        wait $pid1; status1=$?

        wait $pid2; status2=$?

        wait $pid3; status3=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ] || [ $status3 -ne 0 ]; then exit
        1; fi

        '
    - name: Push to Registry
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      run: j2g_op push_to_registry
    - name: Deploy to Staging
      if: github.ref == 'refs/heads/main'
      run: j2g_op deploy_to_staging
    - name: "DAST \u2014 OWASP ZAP"
      id: dast
      if: github.ref == 'refs/heads/main'
      run: j2g_op dast_owasp_zap
    - name: "DAST \u2014 OWASP ZAP Post Always"
      if: always() && steps.dast.outcome != 'skipped'
      run: j2g_op dast_owasp_zap_post_always --writes /zap/reports/**
    - name: Deploy to Production
      if: github.ref == 'refs/heads/main'
      run: j2g_op deploy_to_production
    - name: Post Success
      if: success()
      run: j2g_op post_success
    - name: Post Failure
      if: failure()
      run: j2g_op post_failure
    - name: Post Always
      if: always()
      run: j2g_op post_always
'on':
  workflow_dispatch: null
