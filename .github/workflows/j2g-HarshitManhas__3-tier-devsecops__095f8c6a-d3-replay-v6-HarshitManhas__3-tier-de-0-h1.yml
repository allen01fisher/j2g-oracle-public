name: Jenkins Pipeline Migration
concurrency:
  group: j2g-HarshitManhas__3-tier-devsecops__095f8c6a-d3-replay-v6-HarshitManhas__3-tier-de-0-h1-${{
    github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  DOCKERHUB_CREDENTIALS_USR: ${{ secrets.DOCKERHUB_CREDENTIALS_USR }}
  DOCKERHUB_CREDENTIALS_PSW: ${{ secrets.DOCKERHUB_CREDENTIALS_PSW }}
  DOCKERHUB_USERNAME: j2g-redacted
  APP_NAME: j2g-redacted
  FRONTEND_REPO: j2g-redacted
  BACKEND_REPO: j2g-redacted
  IMAGE_TAG: j2g-redacted
  AWS_REGION: j2g-redacted
  SONAR_PROJECT_KEY: j2g-redacted
  GITOPS_BRANCH: j2g-redacted
  J2G_RUN_ID: HarshitManhas__3-tier-devsecops__095f8c6a-d3-replay-v6-HarshitManhas__3-tier-de-0-h1
  J2G_SCENARIO_ID: HarshitManhas__3-tier-devsecops__095f8c6a-d3-replay-v6-HarshitManhas__3-tier-de-0-h1
  J2G_FAULTS: sonarqube_quality_gate
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - uses: actions/checkout@v4
    - name: Gitleaks Secret Scan
      run: j2g_op gitleaks_secret_scan
    - name: Gitleaks Secret Scan Post Always
      if: always()
      run: j2g_op gitleaks_secret_scan_post_always --writes gitleaks-report.json
    - name: Install Dependencies
      run: "set +e\n(cd api && npm install --legacy-peer-deps) &\npid1=$!\n(cd client\
        \ && npm install --legacy-peer-deps) &\npid2=$!\nwait $pid1\nstatus1=$?\n\
        wait $pid2\nstatus2=$?\nif [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then\n\
        \  exit 1\nfi\n"
    - name: Unit Tests
      run: j2g_op unit_tests
    - name: Unit Tests Post Always
      if: always()
      run: j2g_op unit_tests_post_always --writes api/coverage/**
    - name: SonarQube Analysis
      run: j2g_op sonarqube_analysis
    - name: SonarQube Quality Gate
      run: j2g_op sonarqube_quality_gate
    - name: Trivy Filesystem Scan
      run: j2g_op trivy_filesystem_scan
    - name: Trivy Filesystem Scan Post Always
      if: always()
      run: j2g_op trivy_filesystem_scan_post_always --writes trivy-fs-report.txt
    - name: Build Docker Images
      run: "set +e\n(docker build -t ${FRONTEND_REPO}:${IMAGE_TAG} -t ${FRONTEND_REPO}:latest\
        \ ./client) &\npid1=$!\n(docker build -t ${BACKEND_REPO}:${IMAGE_TAG} -t ${BACKEND_REPO}:latest\
        \ ./api) &\npid2=$!\nwait $pid1\nstatus1=$?\nwait $pid2\nstatus2=$?\nif [\
        \ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Trivy Image Scan
      run: "set +e\n(\n  if command -v trivy &>/dev/null; then\n      trivy image\
        \ \\\n          --exit-code 0 \\\n          --severity HIGH,CRITICAL \\\n\
        \          --format table \\\n          --output trivy-frontend-image.txt\
        \ \\\n          ${FRONTEND_REPO}:${IMAGE_TAG} || true\n      cat trivy-frontend-image.txt\n\
        \  else\n      echo \"Trivy not available\" > trivy-frontend-image.txt\n \
        \ fi\n) &\npid1=$!\n(\n  if command -v trivy &>/dev/null; then\n      trivy\
        \ image \\\n          --exit-code 0 \\\n          --severity HIGH,CRITICAL\
        \ \\\n          --format table \\\n          --output trivy-backend-image.txt\
        \ \\\n          ${BACKEND_REPO}:${IMAGE_TAG} || true\n      cat trivy-backend-image.txt\n\
        \  else\n      echo \"Trivy not available\" > trivy-backend-image.txt\n  fi\n\
        ) &\npid2=$!\nwait $pid1\nstatus1=$?\nwait $pid2\nstatus2=$?\nif [ $status1\
        \ -ne 0 ] || [ $status2 -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Archive Trivy Image Scan Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-scan-results
        path: 'trivy-frontend-image.txt

          trivy-backend-image.txt

          '
        if-no-files-found: ignore
    - name: Push to DockerHub
      run: j2g_op push_to_dockerhub
    - name: Update GitOps Repo
      run: j2g_op update_gitops_repo
    - name: Post Actions
      if: always()
      run: "set +e\nstatus=0\nif [ \"${{ job.status }}\" = \"success\" ]; then\n \
        \ j2g_op post_success\n  status=$?\nelif [ \"${{ job.status }}\" = \"failure\"\
        \ ]; then\n  j2g_op post_failure\n  status=$?\nfi\nj2g_op post_always\nalways_status=$?\n\
        if [ $status -ne 0 ]; then\n  exit $status\nfi\nexit $always_status\n"
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
