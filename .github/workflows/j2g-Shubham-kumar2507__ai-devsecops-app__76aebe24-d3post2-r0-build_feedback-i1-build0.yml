name: CI/CD Pipeline
env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_CREDENTIALS: ${{ secrets.DOCKER_CREDENTIALS }}
  IMAGE_PREFIX: j2g-redacted
  SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
  SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
  K8S_NAMESPACE_STG: j2g-redacted
  K8S_NAMESPACE_PROD: j2g-redacted
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  BUILD_TAG: j2g-redacted
  BACKEND_IMAGE: j2g-redacted
  FRONTEND_IMAGE: j2g-redacted
  GIT_COMMIT: ${{ github.sha }}
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}
  J2G_RUN_ID: Shubham-kumar2507__ai-devsecops-app__76aebe24-d3post2-r0-build_feedback-i1-build0
  J2G_FAULTS: ''
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: j2g-Shubham-kumar2507__ai-devsecops-app__76aebe24-d3post2-r0-build_feedback-i1-build0-${{
        github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Configure kubeconfig
      run: 'echo "${{ secrets.KUBECONFIG }}" > ${{ runner.temp }}/kubeconfig

        echo "KUBECONFIG=${{ runner.temp }}/kubeconfig" >> $GITHUB_ENV

        '
    - name: Checkout
      run: j2g_op checkout
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install Dependencies
      run: "(cd backend && npm ci --prefer-offline) &\npid1=$!\n(cd frontend && npm\
        \ ci --prefer-offline) &\npid2=$!\nwait $pid1; status1=$?\nwait $pid2; status2=$?\n\
        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Lint
      run: "(cd backend && npm run lint --if-present || echo \"No lint script configured\"\
        ) &\npid1=$!\n(cd frontend && npm run lint --if-present || echo \"No lint\
        \ script configured\") &\npid2=$!\nwait $pid1; status1=$?\nwait $pid2; status2=$?\n\
        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Unit Tests
      id: tests
      run: "(cd backend && npm test -- --ci --reporters=default --reporters=jest-junit\
        \ --coverage --coverageReporters=text --coverageReporters=cobertura --passWithNoTests)\
        \ &\npid1=$!\n(cd frontend && npm test -- --ci --reporters=default --reporters=jest-junit\
        \ --passWithNoTests) &\npid2=$!\nwait $pid1; status1=$?\nwait $pid2; status2=$?\n\
        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Upload Backend Test Results
      if: always() && steps.tests.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: 'backend/junit.xml

          backend/coverage/cobertura-coverage.xml

          '
        if-no-files-found: ignore
    - name: Upload Frontend Test Results
      if: always() && steps.tests.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: frontend/junit.xml
        if-no-files-found: ignore
    - name: "SAST \u2014 SonarQube"
      id: sast
      run: j2g_op sast_sonarqube
    - name: "SAST \u2014 SonarQube post"
      if: always() && steps.sast.outcome != 'skipped'
      run: j2g_op sast_sonarqube_post_always
    - name: Docker Build
      run: "(docker build --target production --tag ${BACKEND_IMAGE}:${BUILD_TAG}\
        \ --tag ${BACKEND_IMAGE}:latest --label \"org.opencontainers.image.revision=${GIT_COMMIT}\"\
        \ --label \"org.opencontainers.image.source=${GIT_URL}\" --no-cache ./backend)\
        \ &\npid1=$!\n(docker build --target production --tag ${FRONTEND_IMAGE}:${BUILD_TAG}\
        \ --tag ${FRONTEND_IMAGE}:latest --label \"org.opencontainers.image.revision=${GIT_COMMIT}\"\
        \ --label \"org.opencontainers.image.source=${GIT_URL}\" --no-cache ./frontend)\
        \ &\npid2=$!\nwait $pid1; status1=$?\nwait $pid2; status2=$?\nif [ $status1\
        \ -ne 0 ] || [ $status2 -ne 0 ]; then\n  exit 1\nfi\n"
    - name: "Container Scan \u2014 Trivy"
      run: "(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest\
        \ image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table\
        \ ${BACKEND_IMAGE}:${BUILD_TAG}) &\npid1=$!\n(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock\
        \ aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed --exit-code\
        \ 1 --format table ${FRONTEND_IMAGE}:${BUILD_TAG}) &\npid2=$!\n(docker run\
        \ --rm -v \"$PWD:/workspace\" -w /workspace aquasec/trivy:latest fs --scanners\
        \ secret --severity HIGH,CRITICAL --exit-code 1 .) &\npid3=$!\nwait $pid1;\
        \ status1=$?\nwait $pid2; status2=$?\nwait $pid3; status3=$?\nif [ $status1\
        \ -ne 0 ] || [ $status2 -ne 0 ] || [ $status3 -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Push to Registry
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      run: j2g_op push_to_registry
    - name: Deploy to Staging
      if: github.ref == 'refs/heads/main'
      run: j2g_op deploy_to_staging
    - name: "DAST \u2014 OWASP ZAP"
      id: dast
      if: github.ref == 'refs/heads/main'
      run: j2g_op dast_owasp_zap
    - name: "DAST \u2014 OWASP ZAP post"
      if: always() && steps.dast.outcome != 'skipped'
      run: j2g_op dast_owasp_zap_post_always --writes /zap/reports/**
    - name: Deploy to Production
      if: github.ref == 'refs/heads/main'
      run: j2g_op deploy_to_production
    - name: Post success
      if: success()
      run: j2g_op post_success
    - name: Post failure
      if: failure()
      run: j2g_op post_failure
    - name: Post always
      if: always()
      run: j2g_op post_always
'on':
  push: null
  schedule:
  - cron: '*/5 * * * *'
