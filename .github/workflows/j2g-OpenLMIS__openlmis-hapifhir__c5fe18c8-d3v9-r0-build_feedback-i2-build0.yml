name: Jenkins Pipeline Migration
concurrency:
  group: j2g-OpenLMIS__openlmis-hapifhir__c5fe18c8-d3v9-r0-build_feedback-i2-build0-pipeline
  cancel-in-progress: false
env:
  COMPOSE_PROJECT_NAME: j2g-redacted
  GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
  J2G_RUN_ID: OpenLMIS__openlmis-hapifhir__c5fe18c8-d3v9-r0-build_feedback-i2-build0
  J2G_FAULTS: ''
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@v4
    - name: Preparation
      id: preparation
      continue-on-error: true
      run: j2g_op preparation
    - name: Preparation post failure
      if: ${{ steps.preparation.outcome == 'failure' }}
      run: j2g_op preparation_post_failure
    - name: Build
      id: build
      if: ${{ steps.preparation.outcome == 'success' }}
      continue-on-error: true
      env:
        PATH: j2g-redacted
        STAGING_VERSION: j2g-redacted
      run: j2g_op build
    - name: Build post success
      if: ${{ steps.build.outcome == 'success' && env.BUILD_UNSTABLE != 'true' }}
      env:
        PATH: j2g-redacted
        STAGING_VERSION: j2g-redacted
      run: j2g_op build_post_success
    - name: Build post unstable
      if: ${{ steps.build.outcome == 'success' && env.BUILD_UNSTABLE == 'true' }}
      env:
        PATH: j2g-redacted
        STAGING_VERSION: j2g-redacted
      run: j2g_op build_post_unstable
    - name: Build post failure
      if: ${{ steps.build.outcome == 'failure' }}
      env:
        PATH: j2g-redacted
        STAGING_VERSION: j2g-redacted
      run: j2g_op build_post_failure
    - name: Deploy to test
      id: deploy_to_test
      if: ${{ steps.preparation.outcome == 'success' && steps.build.outcome == 'success'
        && env.BUILD_UNSTABLE != 'true' && env.CURRENT_BRANCH == 'master' && endsWith(env.VERSION,
        'SNAPSHOT') }}
      continue-on-error: true
      run: j2g_op deploy_to_test
    - name: Deploy to test post failure
      if: ${{ steps.deploy_to_test.outcome == 'failure' }}
      run: j2g_op deploy_to_test_post_failure
    - name: Contract tests
      id: contract_tests
      if: ${{ steps.preparation.outcome == 'success' && steps.build.outcome == 'success'
        && env.BUILD_UNSTABLE != 'true' && (steps.deploy_to_test.outcome == 'success'
        || steps.deploy_to_test.outcome == 'skipped') && endsWith(env.VERSION, 'SNAPSHOT')
        }}
      continue-on-error: true
      run: j2g_op contract_tests
    - name: Contract tests post failure
      if: ${{ steps.contract_tests.outcome == 'failure' }}
      run: j2g_op contract_tests_post_failure
    - name: Push image
      id: push_image
      if: ${{ steps.preparation.outcome == 'success' && steps.build.outcome == 'success'
        && env.BUILD_UNSTABLE != 'true' && (steps.deploy_to_test.outcome == 'success'
        || steps.deploy_to_test.outcome == 'skipped') && (steps.contract_tests.outcome
        == 'success' || steps.contract_tests.outcome == 'skipped') && ((startsWith(env.GIT_BRANCH,
        'rel-') && env.GIT_BRANCH != 'rel-') || (env.GIT_BRANCH == 'master' && !endsWith(env.VERSION,
        'SNAPSHOT'))) }}
      continue-on-error: true
      run: j2g_op push_image
    - name: Push image post success
      if: ${{ steps.push_image.outcome == 'success' }}
      run: j2g_op push_image_post_success
    - name: Push image post failure
      if: ${{ steps.push_image.outcome == 'failure' }}
      run: j2g_op push_image_post_failure
    - name: Check previous run status
      id: previous_run
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: "const current = await github.rest.actions.getWorkflowRun({\n  owner:\
          \ context.repo.owner,\n  repo: context.repo.repo,\n  run_id: context.runId\n\
          });\nconst workflowId = current.data.workflow_id;\nconst runs = await github.rest.actions.listWorkflowRuns({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  workflow_id:\
          \ workflowId,\n  branch: context.ref.replace('refs/heads/', ''),\n  status:\
          \ 'completed',\n  per_page: 20\n});\nconst previous = runs.data.workflow_runs.find(r\
          \ => r.id !== context.runId);\ncore.setOutput('previous_failed', previous\
          \ && previous.conclusion === 'failure' ? 'true' : 'false');\n"
    - name: Post fixed
      if: ${{ steps.preparation.outcome == 'success' && steps.build.outcome == 'success'
        && env.BUILD_UNSTABLE != 'true' && (steps.deploy_to_test.outcome == 'success'
        || steps.deploy_to_test.outcome == 'skipped') && (steps.contract_tests.outcome
        == 'success' || steps.contract_tests.outcome == 'skipped') && (steps.push_image.outcome
        == 'success' || steps.push_image.outcome == 'skipped') && steps.previous_run.outputs.previous_failed
        == 'true' }}
      run: j2g_op post_fixed
    - name: Fail if any stage failed
      if: ${{ always() && (steps.preparation.outcome == 'failure' || steps.build.outcome
        == 'failure' || steps.deploy_to_test.outcome == 'failure' || steps.contract_tests.outcome
        == 'failure' || steps.push_image.outcome == 'failure') }}
      run: exit 1
'on':
  push: null
  workflow_dispatch:
    inputs:
      contractTestsBranch:
        description: The branch of contract tests to checkout
        required: false
        default: master
        type: string
