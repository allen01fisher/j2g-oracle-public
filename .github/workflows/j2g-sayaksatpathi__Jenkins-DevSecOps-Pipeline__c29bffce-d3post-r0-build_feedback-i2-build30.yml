name: Jenkins Pipeline Migration
concurrency:
  group: j2g-sayaksatpathi__Jenkins-DevSecOps-Pipeline__c29bffce-d3post-r0-build_feedback-i2-build30-${{
    github.workflow }}
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: j2g-redacted
      AWS_REGION: j2g-redacted
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      FORCE_DEPLOY: ${{ inputs.FORCE_DEPLOY }}
      SKIP_TRIVY_BLOCKING: ${{ inputs.SKIP_TRIVY_BLOCKING }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      run: j2g_op checkout
    - name: Unit Test
      id: unit_test
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op unit_test
    - name: Unit Test Post Always
      if: ${{ always() && steps.unit_test.outcome != 'skipped' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op unit_test_post_always
    - name: Unit Test Post Failure
      if: ${{ failure() && steps.unit_test.outcome == 'failure' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op unit_test_post_failure
    - name: Unit Test Post Success
      if: ${{ success() && steps.unit_test.outcome == 'success' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op unit_test_post_success
    - name: Lint
      id: lint
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op lint
    - name: Lint Post Failure
      if: ${{ failure() && steps.lint.outcome == 'failure' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op lint_post_failure
    - name: SAST
      id: sast
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op sast
    - name: SAST Post Always
      if: ${{ always() && steps.sast.outcome != 'skipped' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op sast_post_always
        --writes reports/semgrep-results.sarif
    - name: SAST Post Failure
      if: ${{ failure() && steps.sast.outcome == 'failure' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op sast_post_failure
    - name: Dependency Scan
      id: dependency_scan
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op dependency_scan
    - name: Dependency Scan Post Always
      if: ${{ always() && steps.dependency_scan.outcome != 'skipped' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op dependency_scan_post_always
        --writes reports/pip-audit-results.json
    - name: Dependency Scan Post Failure
      if: ${{ failure() && steps.dependency_scan.outcome == 'failure' }}
      run: docker run --rm --user root --network host -v "${{ github.workspace }}:${{
        github.workspace }}" -v "$(command -v j2g_op):/usr/local/bin/j2g_op" -w "${{
        github.workspace }}" -e APP_NAME -e AWS_REGION -e ECR_REGISTRY -e DEPLOY_HOST
        -e FORCE_DEPLOY -e SKIP_TRIVY_BLOCKING python:3.12-slim j2g_op dependency_scan_post_failure
    - name: Docker Build
      id: docker_build
      run: j2g_op docker_build
    - name: Docker Build Post Failure
      if: ${{ failure() && steps.docker_build.outcome == 'failure' }}
      run: j2g_op docker_build_post_failure
    - name: Trivy Scan
      id: trivy_scan
      run: j2g_op trivy_scan
    - name: Trivy Scan Post Always
      if: ${{ always() && steps.trivy_scan.outcome != 'skipped' }}
      run: j2g_op trivy_scan_post_always --writes reports/trivy-results.json,reports/trivy-table.txt
    - name: Trivy Scan Post Failure
      if: ${{ failure() && steps.trivy_scan.outcome == 'failure' }}
      run: j2g_op trivy_scan_post_failure
    - name: SBOM
      id: sbom
      run: j2g_op sbom
    - name: SBOM Post Always
      if: ${{ always() && steps.sbom.outcome != 'skipped' }}
      run: j2g_op sbom_post_always --writes reports/sbom-*.json
    - name: SBOM Post Failure
      if: ${{ failure() && steps.sbom.outcome == 'failure' }}
      run: j2g_op sbom_post_failure
    - name: Push to ECR
      id: push_to_ecr
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op push_to_ecr
    - name: Push to ECR Post Failure
      if: ${{ failure() && steps.push_to_ecr.outcome == 'failure' }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op push_to_ecr_post_failure
    - name: Sign Image
      id: sign_image
      env:
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: j2g_op sign_image
    - name: Sign Image Post Failure
      if: ${{ failure() && steps.sign_image.outcome == 'failure' }}
      env:
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: j2g_op sign_image_post_failure
    - name: Deploy
      id: deploy
      if: ${{ github.ref == 'refs/heads/main' || inputs.FORCE_DEPLOY == true }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op deploy
    - name: Deploy Post Failure
      if: ${{ failure() && steps.deploy.outcome == 'failure' }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op deploy_post_failure
    - name: Verify
      id: verify
      if: ${{ github.ref == 'refs/heads/main' || inputs.FORCE_DEPLOY == true }}
      run: j2g_op verify
    - name: Verify Post Failure
      if: ${{ failure() && steps.verify.outcome == 'failure' }}
      run: j2g_op verify_post_failure
    - name: Verify Post Success
      if: ${{ success() && steps.verify.outcome == 'success' }}
      run: j2g_op verify_post_success
    - name: Post Always
      if: ${{ always() }}
      run: j2g_op post_always --writes reports/**
    - name: Post Success
      if: ${{ success() }}
      run: j2g_op post_success
    - name: Post Failure
      if: ${{ failure() }}
      run: j2g_op post_failure
    - name: Post Unstable
      if: ${{ false }}
      run: j2g_op post_unstable
    - name: Post Cleanup
      if: ${{ always() }}
      run: j2g_op post_cleanup
env:
  J2G_RUN_ID: sayaksatpathi__Jenkins-DevSecOps-Pipeline__c29bffce-d3post-r0-build_feedback-i2-build30
  J2G_FAULTS: ''
'on':
  workflow_dispatch:
    inputs:
      FORCE_DEPLOY:
        description: Force deployment on non-main branches (for manual testing)
        type: boolean
        default: false
      SKIP_TRIVY_BLOCKING:
        description: "Treat Trivy CRITICAL findings as warnings (emergency override\
          \ \u2014 use with caution)"
        type: boolean
        default: false
