name: CI/CD Pipeline
env:
  DOCKER_REGISTRY: j2g-redacted
  DOCKER_CREDENTIALS: j2g-redacted
  TEST_DB_URL: j2g-redacted
  APP_VERSION: j2g-redacted
  USER_SERVICE: j2g-redacted
  TICKET_SERVICE: j2g-redacted
  SUBSCRIPTION_SERVICE: j2g-redacted
  API_GATEWAY: j2g-redacted
  FRONTEND_APP: j2g-redacted
  MAVEN_OPTS: j2g-redacted
  J2G_RUN_ID: ettomarett__Soa_Bus_Management_App__214f164f-rehearsal2-r0-build_feedback-i1-build7
  J2G_FAULTS: ''
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      run: j2g_op checkout
  environment_setup:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Environment Setup
      run: j2g_op environment_setup
  code_quality_backend:
    needs: environment_setup
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Backend Code Analysis
      run: j2g_op backend_code_analysis
  code_quality_frontend:
    needs: environment_setup
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Frontend Code Analysis
      run: j2g_op frontend_code_analysis
  security_scan:
    needs: environment_setup
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Security Scan
      run: j2g_op security_scan
  build_backend:
    needs:
    - code_quality_backend
    - code_quality_frontend
    - security_scan
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Backend Services Build
      run: j2g_op backend_services_build
  build_frontend:
    needs:
    - code_quality_backend
    - code_quality_frontend
    - security_scan
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Frontend Build
      run: j2g_op frontend_build
  backend_tests:
    needs:
    - build_backend
    - build_frontend
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Backend Tests
      run: j2g_op backend_tests
  frontend_tests:
    needs:
    - build_backend
    - build_frontend
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Frontend Tests
      run: j2g_op frontend_tests
  integration_tests:
    needs:
    - backend_tests
    - frontend_tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Integration Tests
      run: j2g_op integration_tests
    - name: Integration Tests Post Always
      if: always()
      run: j2g_op integration_tests_post_always
  build_image_user:
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Build User Service Image
      run: j2g_op build_user_service_image
  build_image_ticket:
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Build Ticket Service Image
      run: j2g_op build_ticket_service_image
  build_image_subscription:
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Build Subscription Service Image
      run: j2g_op build_subscription_service_image
  build_image_api_gateway:
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Build API Gateway Image
      run: j2g_op build_api_gateway_image
  build_image_frontend:
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Build Frontend Image
      run: j2g_op build_frontend_image
  scan_user_service:
    needs:
    - build_image_user
    - build_image_ticket
    - build_image_subscription
    - build_image_api_gateway
    - build_image_frontend
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Scan User Service
      run: j2g_op scan_user_service
  scan_ticket_service:
    needs:
    - build_image_user
    - build_image_ticket
    - build_image_subscription
    - build_image_api_gateway
    - build_image_frontend
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Scan Ticket Service
      run: j2g_op scan_ticket_service
  scan_frontend_app:
    needs:
    - build_image_user
    - build_image_ticket
    - build_image_subscription
    - build_image_api_gateway
    - build_image_frontend
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Scan Frontend App
      run: j2g_op scan_frontend_app
  end_to_end_tests:
    needs:
    - scan_user_service
    - scan_ticket_service
    - scan_frontend_app
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: End-to-End Tests
      run: j2g_op end_to_end_tests
    - name: End-to-End Tests Post Always
      if: always()
      run: j2g_op end_to_end_tests_post_always
  push_to_registry:
    needs: end_to_end_tests
    if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Push to Registry
      run: j2g_op push_to_registry
  deploy_to_staging:
    needs: push_to_registry
    if: ${{ success() && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Deploy to Staging
      run: j2g_op deploy_to_staging
  deploy_to_production:
    needs: push_to_registry
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Deploy to Production
      run: j2g_op deploy_to_production
  post:
    needs:
    - checkout
    - environment_setup
    - code_quality_backend
    - code_quality_frontend
    - security_scan
    - build_backend
    - build_frontend
    - backend_tests
    - frontend_tests
    - integration_tests
    - build_image_user
    - build_image_ticket
    - build_image_subscription
    - build_image_api_gateway
    - build_image_frontend
    - scan_user_service
    - scan_ticket_service
    - scan_frontend_app
    - end_to_end_tests
    - push_to_registry
    - deploy_to_staging
    - deploy_to_production
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Post Always
      run: j2g_op post_always --writes **/target/*.jar,**/build/**
    - name: Post Success
      if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result,
        'cancelled') }}
      run: j2g_op post_success
    - name: Post Failure
      if: ${{ always() && contains(needs.*.result, 'failure') }}
      run: j2g_op post_failure
    - name: Post Unstable
      if: ${{ always() && false }}
      run: j2g_op post_unstable
'on':
  workflow_dispatch: null
