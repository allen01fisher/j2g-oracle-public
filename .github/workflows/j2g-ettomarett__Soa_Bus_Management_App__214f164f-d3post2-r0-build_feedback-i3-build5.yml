name: CI
env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_CREDENTIALS: ${{ secrets.DOCKER_CREDENTIALS }}
  TEST_DB_URL: j2g-redacted
  APP_VERSION: j2g-redacted
  USER_SERVICE: j2g-redacted
  TICKET_SERVICE: j2g-redacted
  SUBSCRIPTION_SERVICE: j2g-redacted
  API_GATEWAY: j2g-redacted
  FRONTEND_APP: j2g-redacted
  MAVEN_OPTS: ${{ secrets.MAVEN_OPTS }}
  J2G_RUN_ID: ettomarett__Soa_Bus_Management_App__214f164f-d3post2-r0-build_feedback-i3-build5
  J2G_FAULTS: ''
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      run: j2g_op checkout
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        clean: false
    - name: Environment Setup
      run: j2g_op environment_setup
    - name: Code Quality & Security
      shell: bash
      run: "set +e\n( echo 'Running static code analysis for backend...'; cd soa/mymicroservices\
        \ && mvn clean compile checkstyle:check spotbugs:check -DskipTests=true )\
        \ &\nbackend_pid=$!\n( echo 'Installing frontend dependencies and running\
        \ linting...'; cd soa/mymicroservices/Frontend && npm ci && npm run lint )\
        \ &\nfrontend_pid=$!\n( echo 'Running security vulnerability scan...'; cd\
        \ soa/mymicroservices && mvn org.owasp:dependency-check-maven:check ) &\n\
        security_pid=$!\nwait $backend_pid; backend_status=$?\nwait $frontend_pid;\
        \ frontend_status=$?\nwait $security_pid; security_status=$?\nif [ $backend_status\
        \ -ne 0 ] || [ $frontend_status -ne 0 ] || [ $security_status -ne 0 ]; then\n\
        \  exit 1\nfi\n"
    - name: Build & Test
      shell: bash
      run: "set +e\n(\n  set -e\n  echo 'Building backend microservices...'\n  cd\
        \ soa/mymicroservices\n  mvn clean compile -DskipTests=true\n  echo \"Building\
        \ User Service...\"\n  cd User && mvn package -DskipTests=true && cd ..\n\
        \  echo \"Building Ticket Service...\"\n  cd Ticket && mvn package -DskipTests=true\
        \ && cd ..\n  echo \"Building Subscription Service...\"\n  cd Subscription\
        \ && mvn package -DskipTests=true && cd ..\n  echo \"Building API Gateway...\"\
        \n  cd api-gateway && mvn package -DskipTests=true && cd ..\n) &\nbackend_build_pid=$!\n\
        (\n  set -e\n  echo 'Building frontend application...'\n  cd soa/mymicroservices/Frontend\n\
        \  npm ci\n  CI=false npm run build\n) &\nfrontend_build_pid=$!\nwait $backend_build_pid;\
        \ backend_build_status=$?\nwait $frontend_build_pid; frontend_build_status=$?\n\
        if [ $backend_build_status -ne 0 ] || [ $frontend_build_status -ne 0 ]; then\n\
        \  exit 1\nfi\n"
    - name: Unit Tests
      id: unit_tests
      shell: bash
      run: "set +e\n( cd soa/mymicroservices && mvn test -Dspring.profiles.active=test\
        \ ) &\nbackend_test_pid=$!\n( cd soa/mymicroservices/Frontend && CI=true npm\
        \ test -- --coverage --watchAll=false ) &\nfrontend_test_pid=$!\nwait $backend_test_pid;\
        \ backend_test_status=$?\nwait $frontend_test_pid; frontend_test_status=$?\n\
        echo \"backend_test_status=$backend_test_status\" >> $GITHUB_OUTPUT\necho\
        \ \"frontend_test_status=$frontend_test_status\" >> $GITHUB_OUTPUT\nif [ $backend_test_status\
        \ -ne 0 ] || [ $frontend_test_status -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Publish backend test results
      if: ${{ always() && steps.unit_tests.outputs.backend_test_status == '0' }}
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: '**/target/surefire-reports/*.xml'
        if-no-files-found: ignore
    - name: Publish backend coverage
      if: ${{ always() && steps.unit_tests.outputs.backend_test_status == '0' }}
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: '**/target/site/jacoco/jacoco.xml'
        if-no-files-found: ignore
    - name: Publish frontend test results
      if: ${{ always() && steps.unit_tests.outputs.frontend_test_status == '0' }}
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: soa/mymicroservices/Frontend/coverage/lcov-report/*.html
        if-no-files-found: ignore
    - name: Integration Tests
      id: integration_tests
      run: j2g_op integration_tests
    - name: Integration Tests Post Always
      if: ${{ always() && steps.integration_tests.outcome != 'skipped' }}
      run: j2g_op integration_tests_post_always
    - name: Build Docker Images
      shell: bash
      run: "set +e\n( cd soa/mymicroservices/User && docker build -t \"${USER_SERVICE}:${APP_VERSION}\"\
        \ . && docker tag \"${USER_SERVICE}:${APP_VERSION}\" \"${USER_SERVICE}:latest\"\
        \ ) &\nuser_pid=$!\n( cd soa/mymicroservices/Ticket && docker build -t \"\
        ${TICKET_SERVICE}:${APP_VERSION}\" . && docker tag \"${TICKET_SERVICE}:${APP_VERSION}\"\
        \ \"${TICKET_SERVICE}:latest\" ) &\nticket_pid=$!\n( cd soa/mymicroservices/Subscription\
        \ && docker build -t \"${SUBSCRIPTION_SERVICE}:${APP_VERSION}\" . && docker\
        \ tag \"${SUBSCRIPTION_SERVICE}:${APP_VERSION}\" \"${SUBSCRIPTION_SERVICE}:latest\"\
        \ ) &\nsubscription_pid=$!\n( cd soa/mymicroservices/api-gateway && docker\
        \ build -t \"${API_GATEWAY}:${APP_VERSION}\" . && docker tag \"${API_GATEWAY}:${APP_VERSION}\"\
        \ \"${API_GATEWAY}:latest\" ) &\ngateway_pid=$!\n( cd soa/mymicroservices/Frontend\
        \ && docker build -t \"${FRONTEND_APP}:${APP_VERSION}\" . && docker tag \"\
        ${FRONTEND_APP}:${APP_VERSION}\" \"${FRONTEND_APP}:latest\" ) &\nfrontend_pid=$!\n\
        wait $user_pid; user_status=$?\nwait $ticket_pid; ticket_status=$?\nwait $subscription_pid;\
        \ subscription_status=$?\nwait $gateway_pid; gateway_status=$?\nwait $frontend_pid;\
        \ frontend_status=$?\nif [ $user_status -ne 0 ] || [ $ticket_status -ne 0\
        \ ] || [ $subscription_status -ne 0 ] || [ $gateway_status -ne 0 ] || [ $frontend_status\
        \ -ne 0 ]; then\n  exit 1\nfi\n"
    - name: Container Security Scan
      shell: bash
      run: "set +e\n( echo 'Scanning User Service container for vulnerabilities...';\
        \ docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest\
        \ image \"${USER_SERVICE}:${APP_VERSION}\" ) &\nuser_scan_pid=$!\n( echo 'Scanning\
        \ Ticket Service container for vulnerabilities...'; docker run --rm -v /var/run/docker.sock:/var/run/docker.sock\
        \ aquasec/trivy:latest image \"${TICKET_SERVICE}:${APP_VERSION}\" ) &\nticket_scan_pid=$!\n\
        ( echo 'Scanning Frontend container for vulnerabilities...'; docker run --rm\
        \ -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image\
        \ \"${FRONTEND_APP}:${APP_VERSION}\" ) &\nfrontend_scan_pid=$!\nwait $user_scan_pid;\
        \ user_scan_status=$?\nwait $ticket_scan_pid; ticket_scan_status=$?\nwait\
        \ $frontend_scan_pid; frontend_scan_status=$?\nif [ $user_scan_status -ne\
        \ 0 ] || [ $ticket_scan_status -ne 0 ] || [ $frontend_scan_status -ne 0 ];\
        \ then\n  exit 1\nfi\n"
    - name: End-to-End Tests
      id: end_to_end_tests
      if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        }}
      run: j2g_op end_to_end_tests
    - name: End-to-End Tests Post Always
      if: ${{ always() && steps.end_to_end_tests.outcome != 'skipped' }}
      run: j2g_op end_to_end_tests_post_always
    - name: Push to Registry
      if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        }}
      run: j2g_op push_to_registry
    - name: Deploy to Staging
      if: ${{ success() && github.ref == 'refs/heads/develop' }}
      run: j2g_op deploy_to_staging
    - name: Deploy to Production
      if: ${{ success() && github.ref == 'refs/heads/main' }}
      run: j2g_op deploy_to_production
    - name: Post Always
      if: always()
      run: j2g_op post_always --writes **/target/*.jar,**/build/**
    - name: Post Success
      if: success()
      run: j2g_op post_success
    - name: Post Failure
      if: failure()
      run: j2g_op post_failure
    - name: Post Unstable
      if: false
      run: j2g_op post_unstable
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
