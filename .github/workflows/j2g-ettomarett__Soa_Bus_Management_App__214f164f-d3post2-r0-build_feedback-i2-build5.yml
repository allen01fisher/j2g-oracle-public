name: CI
env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_CREDENTIALS: ${{ secrets.DOCKER_CREDENTIALS }}
  TEST_DB_URL: j2g-redacted
  APP_VERSION: j2g-redacted
  USER_SERVICE: j2g-redacted
  TICKET_SERVICE: j2g-redacted
  SUBSCRIPTION_SERVICE: j2g-redacted
  API_GATEWAY: j2g-redacted
  FRONTEND_APP: j2g-redacted
  MAVEN_OPTS: j2g-redacted
  J2G_RUN_ID: ettomarett__Soa_Bus_Management_App__214f164f-d3post2-r0-build_feedback-i2-build5
  J2G_FAULTS: ''
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      run: j2g_op checkout
  environment-setup:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Environment Setup
      run: j2g_op environment_setup
  backend-code-analysis:
    needs: environment-setup
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Backend Code Analysis
      working-directory: soa/mymicroservices
      run: 'echo ''Running static code analysis for backend...''

        mvn clean compile checkstyle:check spotbugs:check -DskipTests=true

        '
  frontend-code-analysis:
    needs: environment-setup
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Frontend Code Analysis
      working-directory: soa/mymicroservices/Frontend
      run: 'echo ''Installing frontend dependencies and running linting...''

        npm ci

        npm run lint

        '
  security-scan:
    needs: environment-setup
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Security Scan
      working-directory: soa/mymicroservices
      run: 'echo ''Running security vulnerability scan...''

        mvn org.owasp:dependency-check-maven:check

        '
  backend-build:
    needs:
    - backend-code-analysis
    - frontend-code-analysis
    - security-scan
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Backend Services Build
      working-directory: soa/mymicroservices
      run: 'echo ''Building backend microservices...''

        mvn clean compile -DskipTests=true

        echo "Building User Service..."

        cd User && mvn package -DskipTests=true && cd ..

        echo "Building Ticket Service..."

        cd Ticket && mvn package -DskipTests=true && cd ..

        echo "Building Subscription Service..."

        cd Subscription && mvn package -DskipTests=true && cd ..

        echo "Building API Gateway..."

        cd api-gateway && mvn package -DskipTests=true && cd ..

        '
  frontend-build:
    needs:
    - backend-code-analysis
    - frontend-code-analysis
    - security-scan
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Frontend Build
      working-directory: soa/mymicroservices/Frontend
      run: 'echo ''Building frontend application...''

        npm ci

        CI=false npm run build

        '
  backend-tests:
    needs:
    - backend-build
    - frontend-build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Backend Tests
      working-directory: soa/mymicroservices
      run: 'echo ''Running backend unit tests...''

        mvn test -Dspring.profiles.active=test

        '
    - name: Publish test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: '**/target/surefire-reports/*.xml'
        if-no-files-found: ignore
    - name: Publish coverage
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: '**/target/site/jacoco/jacoco.xml'
        if-no-files-found: ignore
  frontend-tests:
    needs:
    - backend-build
    - frontend-build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install frontend dependencies
      working-directory: soa/mymicroservices/Frontend
      run: npm ci
    - name: Frontend Tests
      working-directory: soa/mymicroservices/Frontend
      run: 'echo ''Running frontend unit tests...''

        CI=true npm test -- --coverage --watchAll=false

        '
    - name: Publish frontend test results
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: soa/mymicroservices/Frontend/coverage/lcov-report/*.html
        if-no-files-found: ignore
  integration-tests:
    needs:
    - backend-tests
    - frontend-tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Integration Tests
      run: j2g_op integration_tests
    - name: Integration Tests Post Always
      if: always()
      run: j2g_op integration_tests_post_always
  docker-build-scan:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Prepare backend artifacts
      working-directory: soa/mymicroservices
      run: 'mvn clean compile -DskipTests=true

        echo "Building User Service..."

        cd User && mvn package -DskipTests=true && cd ..

        echo "Building Ticket Service..."

        cd Ticket && mvn package -DskipTests=true && cd ..

        echo "Building Subscription Service..."

        cd Subscription && mvn package -DskipTests=true && cd ..

        echo "Building API Gateway..."

        cd api-gateway && mvn package -DskipTests=true && cd ..

        '
    - name: Prepare frontend artifacts
      working-directory: soa/mymicroservices/Frontend
      run: 'npm ci

        CI=false npm run build

        '
    - name: Build User Service Image
      working-directory: soa/mymicroservices/User
      run: 'docker build -t "${USER_SERVICE}:${APP_VERSION}" .

        docker tag "${USER_SERVICE}:${APP_VERSION}" "${USER_SERVICE}:latest"

        '
    - name: Build Ticket Service Image
      working-directory: soa/mymicroservices/Ticket
      run: 'docker build -t "${TICKET_SERVICE}:${APP_VERSION}" .

        docker tag "${TICKET_SERVICE}:${APP_VERSION}" "${TICKET_SERVICE}:latest"

        '
    - name: Build Subscription Service Image
      working-directory: soa/mymicroservices/Subscription
      run: 'docker build -t "${SUBSCRIPTION_SERVICE}:${APP_VERSION}" .

        docker tag "${SUBSCRIPTION_SERVICE}:${APP_VERSION}" "${SUBSCRIPTION_SERVICE}:latest"

        '
    - name: Build API Gateway Image
      working-directory: soa/mymicroservices/api-gateway
      run: 'docker build -t "${API_GATEWAY}:${APP_VERSION}" .

        docker tag "${API_GATEWAY}:${APP_VERSION}" "${API_GATEWAY}:latest"

        '
    - name: Build Frontend Image
      working-directory: soa/mymicroservices/Frontend
      run: 'docker build -t "${FRONTEND_APP}:${APP_VERSION}" .

        docker tag "${FRONTEND_APP}:${APP_VERSION}" "${FRONTEND_APP}:latest"

        '
    - name: Scan User Service
      run: 'echo ''Scanning User Service container for vulnerabilities...''

        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
        image "${USER_SERVICE}:${APP_VERSION}"

        '
    - name: Scan Ticket Service
      run: 'echo ''Scanning Ticket Service container for vulnerabilities...''

        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
        image "${TICKET_SERVICE}:${APP_VERSION}"

        '
    - name: Scan Frontend App
      run: 'echo ''Scanning Frontend container for vulnerabilities...''

        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
        image "${FRONTEND_APP}:${APP_VERSION}"

        '
  e2e-tests:
    needs: docker-build-scan
    if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: End-to-End Tests
      run: j2g_op end_to_end_tests
    - name: End-to-End Tests Post Always
      if: always()
      run: j2g_op end_to_end_tests_post_always
  push-to-registry:
    needs: e2e-tests
    if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Push to Registry
      run: j2g_op push_to_registry
  deploy-to-staging:
    needs: push-to-registry
    if: ${{ success() && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Deploy to Staging
      run: j2g_op deploy_to_staging
  deploy-to-production:
    needs: push-to-registry
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Deploy to Production
      run: j2g_op deploy_to_production
  post:
    needs:
    - checkout
    - environment-setup
    - backend-code-analysis
    - frontend-code-analysis
    - security-scan
    - backend-build
    - frontend-build
    - backend-tests
    - frontend-tests
    - integration-tests
    - docker-build-scan
    - e2e-tests
    - push-to-registry
    - deploy-to-staging
    - deploy-to-production
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Post Always
      run: j2g_op post_always --writes **/target/*.jar,**/build/**
    - name: Post Success
      if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result,
        'cancelled') }}
      run: j2g_op post_success
    - name: Post Failure
      if: ${{ always() && contains(needs.*.result, 'failure') }}
      run: j2g_op post_failure
    - name: Post Unstable
      if: ${{ false }}
      run: j2g_op post_unstable
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
