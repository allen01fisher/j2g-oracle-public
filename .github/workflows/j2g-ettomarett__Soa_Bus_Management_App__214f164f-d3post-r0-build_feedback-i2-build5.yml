name: CI/CD
env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_CREDENTIALS: ${{ secrets.DOCKER_CREDENTIALS }}
  TEST_DB_URL: j2g-redacted
  APP_VERSION: j2g-redacted
  USER_SERVICE: j2g-redacted
  TICKET_SERVICE: j2g-redacted
  SUBSCRIPTION_SERVICE: j2g-redacted
  API_GATEWAY: j2g-redacted
  FRONTEND_APP: j2g-redacted
  MAVEN_OPTS: j2g-redacted
  J2G_RUN_ID: ettomarett__Soa_Bus_Management_App__214f164f-d3post-r0-build_feedback-i2-build5
  J2G_FAULTS: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - uses: actions/checkout@v4
    - name: Checkout
      run: j2g_op checkout
    - name: Environment Setup
      run: j2g_op environment_setup
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Set up Maven 3.9.0
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.0
    - name: Code Quality & Security
      run: 'set -e

        (cd soa/mymicroservices && echo ''Running static code analysis for backend...''
        && mvn clean compile checkstyle:check spotbugs:check -DskipTests=true) &

        pid1=$!

        (cd soa/mymicroservices/Frontend && echo ''Installing frontend dependencies
        and running linting...'' && npm ci && npm run lint) &

        pid2=$!

        (cd soa/mymicroservices && echo ''Running security vulnerability scan...''
        && mvn org.owasp:dependency-check-maven:check) &

        pid3=$!

        status1=0; wait $pid1 || status1=$?

        status2=0; wait $pid2 || status2=$?

        status3=0; wait $pid3 || status3=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ] || [ $status3 -ne 0 ]; then exit
        1; fi

        '
    - name: Build & Test
      run: 'set -e

        (cd soa/mymicroservices && echo ''Building backend microservices...'' && mvn
        clean compile -DskipTests=true && echo "Building User Service..." && cd User
        && mvn package -DskipTests=true && cd .. && echo "Building Ticket Service..."
        && cd Ticket && mvn package -DskipTests=true && cd .. && echo "Building Subscription
        Service..." && cd Subscription && mvn package -DskipTests=true && cd .. &&
        echo "Building API Gateway..." && cd api-gateway && mvn package -DskipTests=true
        && cd ..) &

        pid1=$!

        (cd soa/mymicroservices/Frontend && echo ''Building frontend application...''
        && npm ci && CI=false npm run build) &

        pid2=$!

        status1=0; wait $pid1 || status1=$?

        status2=0; wait $pid2 || status2=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then exit 1; fi

        '
    - name: Unit Tests
      run: 'set -e

        (cd soa/mymicroservices && echo ''Running backend unit tests...'' && mvn test
        -Dspring.profiles.active=test) &

        pid1=$!

        (cd soa/mymicroservices/Frontend && echo ''Running frontend unit tests...''
        && CI=true npm test -- --coverage --watchAll=false) &

        pid2=$!

        status1=0; wait $pid1 || status1=$?

        status2=0; wait $pid2 || status2=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ]; then exit 1; fi

        '
    - name: Upload Backend Test Results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: '**/target/surefire-reports/*.xml'
    - name: Upload Backend Coverage
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: '**/target/site/jacoco/jacoco.xml'
    - name: Upload Frontend Test Results
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: soa/mymicroservices/Frontend/coverage/lcov-report/*.html
    - name: Integration Tests
      id: integration_tests
      run: j2g_op integration_tests
    - name: Integration Tests Post Always
      if: always() && steps.integration_tests.outcome != 'skipped'
      run: j2g_op integration_tests_post_always
    - name: Build Docker Images
      run: 'set -e

        (cd soa/mymicroservices/User && docker build -t ${USER_SERVICE}:${APP_VERSION}
        . && docker tag ${USER_SERVICE}:${APP_VERSION} ${USER_SERVICE}:latest) &

        pid1=$!

        (cd soa/mymicroservices/Ticket && docker build -t ${TICKET_SERVICE}:${APP_VERSION}
        . && docker tag ${TICKET_SERVICE}:${APP_VERSION} ${TICKET_SERVICE}:latest)
        &

        pid2=$!

        (cd soa/mymicroservices/Subscription && docker build -t ${SUBSCRIPTION_SERVICE}:${APP_VERSION}
        . && docker tag ${SUBSCRIPTION_SERVICE}:${APP_VERSION} ${SUBSCRIPTION_SERVICE}:latest)
        &

        pid3=$!

        (cd soa/mymicroservices/api-gateway && docker build -t ${API_GATEWAY}:${APP_VERSION}
        . && docker tag ${API_GATEWAY}:${APP_VERSION} ${API_GATEWAY}:latest) &

        pid4=$!

        (cd soa/mymicroservices/Frontend && docker build -t ${FRONTEND_APP}:${APP_VERSION}
        . && docker tag ${FRONTEND_APP}:${APP_VERSION} ${FRONTEND_APP}:latest) &

        pid5=$!

        status1=0; wait $pid1 || status1=$?

        status2=0; wait $pid2 || status2=$?

        status3=0; wait $pid3 || status3=$?

        status4=0; wait $pid4 || status4=$?

        status5=0; wait $pid5 || status5=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ] || [ $status3 -ne 0 ] || [ $status4
        -ne 0 ] || [ $status5 -ne 0 ]; then exit 1; fi

        '
    - name: Container Security Scan
      run: 'set -e

        (echo ''Scanning User Service container for vulnerabilities...'' && docker
        run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
        image ${USER_SERVICE}:${APP_VERSION}) &

        pid1=$!

        (echo ''Scanning Ticket Service container for vulnerabilities...'' && docker
        run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
        image ${TICKET_SERVICE}:${APP_VERSION}) &

        pid2=$!

        (echo ''Scanning Frontend container for vulnerabilities...'' && docker run
        --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image
        ${FRONTEND_APP}:${APP_VERSION}) &

        pid3=$!

        status1=0; wait $pid1 || status1=$?

        status2=0; wait $pid2 || status2=$?

        status3=0; wait $pid3 || status3=$?

        if [ $status1 -ne 0 ] || [ $status2 -ne 0 ] || [ $status3 -ne 0 ]; then exit
        1; fi

        '
    - name: End-to-End Tests
      id: e2e
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: j2g_op end_to_end_tests
    - name: End-to-End Tests Post Always
      if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        && steps.e2e.outcome != 'skipped'
      run: j2g_op end_to_end_tests_post_always
    - name: Push to Registry
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: j2g_op push_to_registry
    - name: Deploy to Staging
      if: success() && github.ref == 'refs/heads/develop'
      run: j2g_op deploy_to_staging
    - name: Deploy to Production
      if: success() && github.ref == 'refs/heads/main'
      run: j2g_op deploy_to_production
    - name: Post Always
      if: always()
      run: j2g_op post_always --writes **/target/*.jar,**/build/**
    - name: Post Success
      if: success()
      run: j2g_op post_success
    - name: Post Failure
      if: failure()
      run: j2g_op post_failure
    - name: Post Unstable
      if: always() && !success() && !failure() && !cancelled()
      run: j2g_op post_unstable
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: null
