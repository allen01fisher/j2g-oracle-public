name: j2g-redacted
concurrency:
  group: j2g-sayaksatpathi__Jenkins-DevSecOps-Pipeline__c29bffce-d3post2-r0-build_feedback-i1-build30-${{
    github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: j2g-redacted
      AWS_REGION: j2g-redacted
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      FORCE_DEPLOY: ${{ github.event.inputs.FORCE_DEPLOY || 'false' }}
      SKIP_TRIVY_BLOCKING: ${{ github.event.inputs.SKIP_TRIVY_BLOCKING || 'false'
        }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      id: checkout
      continue-on-error: true
      run: j2g_op checkout
    - name: Mark pipeline failed (Checkout)
      if: always() && steps.checkout.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Unit Test
      id: unit_test
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      run: j2g_op unit_test
    - name: Mark pipeline failed (Unit Test)
      if: always() && steps.unit_test.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Unit Test post always
      if: always() && steps.unit_test.outcome != 'skipped'
      run: j2g_op unit_test_post_always
    - name: Unit Test post failure
      if: always() && steps.unit_test.outcome != 'skipped' && (steps.unit_test.outcome
        == 'failure' || failure())
      run: j2g_op unit_test_post_failure
    - name: Unit Test post success
      if: always() && steps.unit_test.outcome == 'success' && success()
      run: j2g_op unit_test_post_success
    - name: Lint
      id: lint
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      run: j2g_op lint
    - name: Mark pipeline failed (Lint)
      if: always() && steps.lint.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Lint post failure
      if: always() && steps.lint.outcome != 'skipped' && (steps.lint.outcome == 'failure'
        || failure())
      run: j2g_op lint_post_failure
    - name: SAST
      id: sast
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      run: j2g_op sast
    - name: Mark pipeline failed (SAST)
      if: always() && steps.sast.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: SAST post always
      if: always() && steps.sast.outcome != 'skipped'
      run: j2g_op sast_post_always --writes reports/semgrep-results.sarif
    - name: SAST post failure
      if: always() && steps.sast.outcome != 'skipped' && (steps.sast.outcome == 'failure'
        || failure())
      run: j2g_op sast_post_failure
    - name: Dependency Scan
      id: dependency_scan
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      run: j2g_op dependency_scan
    - name: Mark pipeline failed (Dependency Scan)
      if: always() && steps.dependency_scan.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Dependency Scan post always
      if: always() && steps.dependency_scan.outcome != 'skipped'
      run: j2g_op dependency_scan_post_always --writes reports/pip-audit-results.json
    - name: Dependency Scan post failure
      if: always() && steps.dependency_scan.outcome != 'skipped' && (steps.dependency_scan.outcome
        == 'failure' || failure())
      run: j2g_op dependency_scan_post_failure
    - name: Docker Build
      id: docker_build
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      run: j2g_op docker_build
    - name: Mark pipeline failed (Docker Build)
      if: always() && steps.docker_build.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Docker Build post failure
      if: always() && steps.docker_build.outcome != 'skipped' && (steps.docker_build.outcome
        == 'failure' || failure())
      run: j2g_op docker_build_post_failure
    - name: Trivy Scan
      id: trivy_scan
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      run: j2g_op trivy_scan
    - name: Mark pipeline failed (Trivy Scan)
      if: always() && steps.trivy_scan.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Trivy Scan post always
      if: always() && steps.trivy_scan.outcome != 'skipped'
      run: j2g_op trivy_scan_post_always --writes reports/trivy-results.json,reports/trivy-table.txt
    - name: Trivy Scan post failure
      if: always() && steps.trivy_scan.outcome != 'skipped' && (steps.trivy_scan.outcome
        == 'failure' || failure())
      run: j2g_op trivy_scan_post_failure
    - name: SBOM
      id: sbom
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      run: j2g_op sbom
    - name: Mark pipeline failed (SBOM)
      if: always() && steps.sbom.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: SBOM post always
      if: always() && steps.sbom.outcome != 'skipped'
      run: j2g_op sbom_post_always --writes reports/sbom-*.json
    - name: SBOM post failure
      if: always() && steps.sbom.outcome != 'skipped' && (steps.sbom.outcome == 'failure'
        || failure())
      run: j2g_op sbom_post_failure
    - name: Push to ECR
      id: push_to_ecr
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op push_to_ecr
    - name: Mark pipeline failed (Push to ECR)
      if: always() && steps.push_to_ecr.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Push to ECR post failure
      if: always() && steps.push_to_ecr.outcome != 'skipped' && (steps.push_to_ecr.outcome
        == 'failure' || failure())
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op push_to_ecr_post_failure
    - name: Sign Image
      id: sign_image
      if: success() && env.PIPELINE_FAILED != 'true'
      continue-on-error: true
      env:
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: j2g_op sign_image
    - name: Mark pipeline failed (Sign Image)
      if: always() && steps.sign_image.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Sign Image post failure
      if: always() && steps.sign_image.outcome != 'skipped' && (steps.sign_image.outcome
        == 'failure' || failure())
      env:
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: j2g_op sign_image_post_failure
    - name: Deploy
      id: deploy
      if: success() && env.PIPELINE_FAILED != 'true' && (github.ref == 'refs/heads/main'
        || github.event.inputs.FORCE_DEPLOY == 'true')
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op deploy
    - name: Mark pipeline failed (Deploy)
      if: always() && steps.deploy.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Deploy post failure
      if: always() && steps.deploy.outcome != 'skipped' && (steps.deploy.outcome ==
        'failure' || failure())
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: j2g_op deploy_post_failure
    - name: Verify
      id: verify
      if: success() && env.PIPELINE_FAILED != 'true' && (github.ref == 'refs/heads/main'
        || github.event.inputs.FORCE_DEPLOY == 'true')
      continue-on-error: true
      run: j2g_op verify
    - name: Mark pipeline failed (Verify)
      if: always() && steps.verify.outcome == 'failure'
      run: echo "PIPELINE_FAILED=true" >> "$GITHUB_ENV"
    - name: Verify post failure
      if: always() && steps.verify.outcome != 'skipped' && (steps.verify.outcome ==
        'failure' || failure())
      run: j2g_op verify_post_failure
    - name: Verify post success
      if: always() && steps.verify.outcome == 'success' && success()
      run: j2g_op verify_post_success
    - name: Fail pipeline if any stage failed
      if: always() && env.PIPELINE_FAILED == 'true'
      run: exit 1
    - name: Post always
      if: always()
      run: j2g_op post_always --writes reports/**
    - name: Post success
      if: success() && env.PIPELINE_FAILED != 'true'
      run: j2g_op post_success
    - name: Post failure
      if: always() && (failure() || env.PIPELINE_FAILED == 'true')
      run: j2g_op post_failure
    - name: Post unstable
      if: ${{ false }}
      run: j2g_op post_unstable
    - name: Post cleanup
      if: always()
      run: j2g_op post_cleanup
env:
  J2G_RUN_ID: sayaksatpathi__Jenkins-DevSecOps-Pipeline__c29bffce-d3post2-r0-build_feedback-i1-build30
  J2G_FAULTS: ''
'on':
  push:
    branches:
    - '**'
  workflow_dispatch:
    inputs:
      FORCE_DEPLOY:
        description: Force deployment on non-main branches (for manual testing)
        required: false
        default: false
        type: boolean
      SKIP_TRIVY_BLOCKING:
        description: "Treat Trivy CRITICAL findings as warnings (emergency override\
          \ \u2014 use with caution)"
        required: false
        default: false
        type: boolean
