name: Jenkinsfile to GitHub Actions
env:
  SLACK_CHANNEL: j2g-redacted
  AWS_ECR_REPOSITORY: j2g-redacted
  J2G_RUN_ID: kristyJinny__react-town__16d83406-d3rest-r0-t0-h0
  J2G_SCENARIO_ID: kristyJinny__react-town__16d83406-d3rest-r0-t0-h0
  J2G_FAULTS: build
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Git Pull
      run: j2g_op git_pull
    - name: Build
      run: j2g_op build
    - name: ecr-upload
      run: j2g_op ecr_upload
    - name: Deploy
      env:
        SSH_USERNAME: ${{ secrets.SSH_NFTTOWN_PROD_USERNAME }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_NFTTOWN_PROD_PRIVATE_KEY }}
      run: "set -euo pipefail\n\nSSH_IDENTITY=\"$RUNNER_TEMP/ssh-nfttown-prod\"\n\
        printf '%s\\n' \"$SSH_PRIVATE_KEY\" > \"$SSH_IDENTITY\"\nchmod 600 \"$SSH_IDENTITY\"\
        \n\nssh_cmd() {\n  local host=\"$1\"\n  local command=\"$2\"\n  ssh -i \"\
        $SSH_IDENTITY\" \\\n    -o StrictHostKeyChecking=no \\\n    -o UserKnownHostsFile=/dev/null\
        \ \\\n    -o BatchMode=yes \\\n    -o IdentitiesOnly=yes \\\n    \"$SSH_USERNAME@$host\"\
        \ \"$command\"\n}\n\nautoScalingGroupName='enta_front_asg'\ninstanceIds=$(aws\
        \ autoscaling describe-auto-scaling-groups \\\n  --auto-scaling-group-names\
        \ \"$autoScalingGroupName\" \\\n  --query 'AutoScalingGroups[0].Instances[*].InstanceId'\
        \ \\\n  --output text)\n\nIFS=$'\\t' read -r -a instanceIdArray <<< \"$instanceIds\"\
        \nif [ ${#instanceIdArray[@]} -eq 0 ]; then\n  instanceIdArray=(\"\")\nfi\n\
        \nASG_SERVER=()\nfor instanceId in \"${instanceIdArray[@]}\"; do\n  echo \"\
        start\"\n  privateIpAddress=$(aws ec2 describe-instances \\\n    --instance-ids\
        \ \"$instanceId\" \\\n    --query 'Reservations[0].Instances[0].PrivateIpAddress'\
        \ \\\n    --output text)\n  echo \"Instance ID: $instanceId, Private IP Address:\
        \ $privateIpAddress\"\n  ASG_SERVER+=(\"$privateIpAddress\")\ndone\n\nfor\
        \ host in \"${ASG_SERVER[@]}\"; do\n  # Deploy - Docker pull Build\n  ssh_cmd\
        \ \"$host\" \"aws ecr get-login-password --region ap-northeast-2 | docker\
        \ login --username AWS --password-stdin 237849436738.dkr.ecr.ap-northeast-2.amazonaws.com\"\
        \n  ssh_cmd \"$host\" \"docker pull 237849436738.dkr.ecr.ap-northeast-2.amazonaws.com/$AWS_ECR_REPOSITORY:latest\"\
        \n\n  # Deploy - Container Run\n  checkContainerCommand='docker ps -a --format\
        \ \"{{.Names}}\" | grep -w nfttown-portal-web-con || true'\n  containerExists=false\n\
        \n  if checkResult=$(ssh_cmd \"$host\" \"$checkContainerCommand\"); then\n\
        \    if [ \"$(echo \"$checkResult\" | tr -d '\\r' | xargs)\" = \"nfttown-portal-web-con\"\
        \ ]; then\n      containerExists=true\n    fi\n  else\n    echo \"Error occurred\
        \ while checking the container: $?\"\n  fi\n\n  if [ \"$containerExists\"\
        \ = true ]; then\n    if ssh_cmd \"$host\" 'docker rm -f nfttown-portal-web-con';\
        \ then\n      checkContainerBackup='docker ps -a --format \"{{.Names}}\" |\
        \ grep -w nfttown-portal-web-con-backup || true'\n      if backupResult=$(ssh_cmd\
        \ \"$host\" \"$checkContainerBackup\"); then\n        if echo \"$backupResult\"\
        \ | grep -q \"nfttown-portal-web-con-backup\"; then\n          ssh_cmd \"\
        $host\" 'docker rm nfttown-portal-web-con-backup' || echo \"Error occurred\
        \ while checking the container: $?\"\n        fi\n      else\n        echo\
        \ \"Error occurred while checking the container: $?\"\n      fi\n      ssh_cmd\
        \ \"$host\" 'docker rename nfttown-portal-web-con nfttown-portal-web-con-backup'\
        \ || echo \"Error occurred while removing the container: $?\"\n    else\n\
        \      echo \"Error occurred while removing the container: $?\"\n    fi\n\
        \  else\n    echo \"Container 'nfttown-portal-web-con' does not exist.\"\n\
        \  fi\n\n  ssh_cmd \"$host\" \"docker run -d --name nfttown-portal-web-con\
        \ -p 80:3000 237849436738.dkr.ecr.ap-northeast-2.amazonaws.com/$AWS_ECR_REPOSITORY:latest\"\
        \n\n  sleep 30\n\n  # Health Check\n  ssh_cmd \"$host\" 'docker system prune\
        \ -a --force'\n  for i in {0..9}; do\n    response=$(ssh_cmd \"$host\" 'curl\
        \ -s -o /dev/null -w \"%{http_code}\" localhost')\n    if [ \"$response\"\
        \ != \"200\" ]; then\n      ssh_cmd \"$host\" 'docker run -d --name nfttown-portal-web-con-backup\
        \ -p 80:3000'\n      ssh_cmd \"$host\" 'docker rm nfttown-portal-web-con'\n\
        \      ssh_cmd \"$host\" 'docker rename nfttown-portal-web-con-backup nfttown-portal-web-con'\n\
        \      echo 'backup deploy' >&2\n      exit 1\n    fi\n  done\n\n  checkContainerBackup='docker\
        \ ps -a --format \"{{.Names}}\" | grep -w nfttown-portal-web-con-backup ||\
        \ true'\n  if backupResult=$(ssh_cmd \"$host\" \"$checkContainerBackup\");\
        \ then\n    if echo \"$backupResult\" | grep -q \"nfttown-portal-web-con-backup\"\
        ; then\n      ssh_cmd \"$host\" 'docker rm nfttown-portal-web-con-backup'\
        \ || echo \"Error occurred while checking the container: $?\"\n    fi\n  else\n\
        \    echo \"Error occurred while checking the container: $?\"\n  fi\ndone\n"
'on':
  workflow_dispatch: {}
